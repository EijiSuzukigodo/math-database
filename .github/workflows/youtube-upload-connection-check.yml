name: Check YouTube upload authorization
on:
  push:
    branches: [youtube-upload-connection-check]
    paths: ['.github/workflows/youtube-upload-connection-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify the saved Google credentials
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          try:
              client = json.loads(os.environ["YOUTUBE_CLIENT_SECRET"])["web"]
              client_id = client["client_id"].strip()
              client_secret = client["client_secret"].strip()
          except (ValueError, KeyError, TypeError, AttributeError):
              raise SystemExit("The GitHub secret does not contain a complete Google web client JSON.")
          refresh_token = os.environ["YOUTUBE_REFRESH_TOKEN"].strip()
          if not all((client_id, client_secret, refresh_token)):
              raise SystemExit("A required credential is empty.")
          fields = dict(client_id=client_id, client_secret=client_secret,
                        refresh_token=refresh_token, grant_type="refresh_token")
          try:
              with urllib.request.urlopen("https://oauth2.googleapis.com/token",
                   urllib.parse.urlencode(fields).encode(), timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              code = json.load(error).get("error")
              safe = {"invalid_client", "invalid_grant", "unauthorized_client", "invalid_request"}
              raise SystemExit("Google rejected authorization: " + (code if code in safe else str(error.code)))
          if not result.get("access_token"):
              raise SystemExit("Google did not return an access token.")
          if "https://www.googleapis.com/auth/youtube.upload" not in result.get("scope", "").split():
              raise SystemExit("The authorization does not include YouTube upload scope.")
          print("YouTube upload authorization verified.")
          import base64, hashlib, subprocess
          key = hashlib.sha256(b"math-database encrypted video transfer v1:" + client_secret.encode()).digest()
          private_der = bytes.fromhex("302e020100300506032b656e04220420") + key
          public_der = subprocess.run(["openssl", "pkey", "-inform", "DER", "-pubout", "-outform", "DER"],
                                      input=private_der, capture_output=True, check=True).stdout
          print("Video transfer public key: " + base64.b64encode(public_der).decode())
          PY
