<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>焦点と距離から2次曲線を描く | みんなの数学データベース</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#f3f7fc;color:#172b48}.wrap{max-width:1050px;margin:auto;padding:18px}h1{font-size:clamp(22px,4vw,32px)}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #17345812}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}label{display:block;font-size:14px;font-weight:700}input,select{width:100%;box-sizing:border-box;margin-top:5px;padding:11px;font-size:17px;border:1px solid #bac8d9;border-radius:9px;background:white}button{padding:11px 16px;border:0;border-radius:9px;background:#1765c1;color:white;font-weight:700;font-size:16px;cursor:pointer}canvas{display:block;width:100%;height:auto;touch-action:pan-y}.hint{color:#4e6480;line-height:1.7}.error{color:#b42318;font-weight:700}.eq{font-size:18px;line-height:1.7;overflow-wrap:anywhere}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tag{background:#e7f0fd;border-radius:6px;padding:4px 9px}.small{font-size:13px}a{color:#1765c1}</style></head><body><main class="wrap"><h1>焦点と距離から2次曲線を描こう</h1><p class="hint">2つの焦点の座標と「距離の和」または「距離の差」を入力すると、楕円・双曲線が自動で描かれます。点Pを動かして定義を確かめましょう。</p><section class="panel"><div class="controls"><label>曲線の種類<select id="kind"><option value="ellipse">楕円（距離の和）</option><option value="hyperbola">双曲線（距離の差の絶対値）</option></select></label><label>焦点 F₁ の x<input id="x1" type="number" step="0.5" value="-3"></label><label>焦点 F₁ の y<input id="y1" type="number" step="0.5" value="0"></label><label>焦点 F₂ の x<input id="x2" type="number" step="0.5" value="3"></label><label>焦点 F₂ の y<input id="y2" type="number" step="0.5" value="0"></label><label id="distanceLabel">距離の和 PF₁+PF₂<input id="d" type="number" min="0" step="0.5" value="10"></label></div><p class="row"><button id="draw">図形を描く</button><button id="reset" style="background:#65748a">初期値に戻す</button></p><div id="error" class="error" role="alert"></div></section><section class="panel"><canvas id="graph" width="900" height="680" aria-label="焦点と二次曲線の座標グラフ"></canvas><div class="row"><label style="flex:1;min-width:200px">曲線上の点 P の位置<input id="angle" type="range" min="0" max="628" value="90"></label></div><p id="measure" class="eq"></p><p id="equation" class="eq"></p><p id="explain" class="hint"></p></section><section class="panel"><h2>考えてみよう</h2><p>① 焦点を固定して距離の和を大きくすると、楕円はどう変化するでしょうか。</p><p>② 距離の和を2つの焦点間の距離に近づけると、どうなるでしょうか。</p><p>③ 双曲線に切り替え、距離の差を変えると枝の開き方はどう変わるでしょうか。</p><p class="small"><a href="high_school.html">高校数学の目次へ戻る</a></p></section></main><script>
const $=id=>document.getElementById(id),cv=$('graph'),ctx=cv.getContext('2d');let state=null;
function n(id){return Number($(id).value)}function fmt(v){return Number(v.toFixed(3)).toString()}
function calc(){const x1=n('x1'),y1=n('y1'),x2=n('x2'),y2=n('y2'),D=n('d'),kind=$('kind').value;const vals=[x1,y1,x2,y2,D];if(vals.some(v=>!Number.isFinite(v))||$('d').value.trim()==='')throw Error('すべての欄に数値を入力してください。');const cx=(x1+x2)/2,cy=(y1+y2)/2,sep=Math.hypot(x2-x1,y2-y1),c=sep/2,a=D/2,ux=sep? (x2-x1)/sep:1,uy=sep?(y2-y1)/sep:0;if(sep<1e-8)throw Error('2つの焦点は異なる位置にしてください。');if(kind==='ellipse'&&D<=sep)throw Error('楕円では、距離の和は焦点間の距離 '+fmt(sep)+' より大きくしてください。');if(kind==='hyperbola'&&(D<=0||D>=sep))throw Error('双曲線では、距離の差の絶対値は 0 より大きく、焦点間の距離 '+fmt(sep)+' より小さくしてください。');return {x1,y1,x2,y2,cx,cy,sep,c,a,b:Math.sqrt(Math.abs(a*a-c*c)),ux,uy,kind,D}}
function point(s,t,branch=1){let X,Y;if(s.kind==='ellipse'){X=s.a*Math.cos(t);Y=s.b*Math.sin(t)}else{X=branch*s.a*Math.cosh(t);Y=s.b*Math.sinh(t)}return [s.cx+s.ux*X-s.uy*Y,s.cy+s.uy*X+s.ux*Y]}
function render(){if(!state)return;const s=state,W=cv.width,H=cv.height,span=Math.max(6,Math.abs(s.cx)+s.a*1.5,Math.abs(s.cy)+s.a*1.5,Math.abs(s.x1)+2,Math.abs(s.x2)+2,Math.abs(s.y1)+2,Math.abs(s.y2)+2);const scale=Math.min((W-100)/(2*span),(H-100)/(2*span)),sx=x=>W/2+x*scale,sy=y=>H/2-y*scale;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const bound=Math.ceil(span),step=bound>20?5:bound>10?2:1;ctx.font='15px sans-serif';ctx.lineWidth=1;for(let v=-bound;v<=bound;v+=step){ctx.strokeStyle='#e5ecf5';ctx.beginPath();ctx.moveTo(sx(v),0);ctx.lineTo(sx(v),H);ctx.moveTo(0,sy(v));ctx.lineTo(W,sy(v));ctx.stroke();ctx.fillStyle='#718199';if(v!==0){ctx.fillText(v,sx(v)+3,sy(0)+17);ctx.fillText(v,sx(0)+6,sy(v)-4)}}ctx.strokeStyle='#8192a9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(W,sy(0));ctx.moveTo(sx(0),0);ctx.lineTo(sx(0),H);ctx.stroke();ctx.fillStyle='#52637a';ctx.fillText('x',W-22,sy(0)-8);ctx.fillText('y',sx(0)+10,18);
ctx.strokeStyle='#1765c1';ctx.lineWidth=4;const trace=(branch)=>{ctx.beginPath();let started=false;const maxT=s.kind==='ellipse'?Math.PI*2:Math.min(3,Math.acosh(Math.max(1.01,span*1.8/s.a)));for(let i=0;i<=600;i++){let t=s.kind==='ellipse'?maxT*i/600:-maxT+2*maxT*i/600;const [x,y]=point(s,t,branch);if(!started){ctx.moveTo(sx(x),sy(y));started=true}else ctx.lineTo(sx(x),sy(y))}ctx.stroke()};trace(1);if(s.kind==='hyperbola')trace(-1);
const q=Number($('angle').value)/100,ang=s.kind==='ellipse'?q: (q/6.28*4-2),branch=s.kind==='hyperbola'&&q>3.14?-1:1,[px,py]=point(s,ang,branch);ctx.strokeStyle='#e29c20';ctx.lineWidth=2;ctx.setLineDash([8,5]);for(const [fx,fy] of [[s.x1,s.y1],[s.x2,s.y2]]){ctx.beginPath();ctx.moveTo(sx(fx),sy(fy));ctx.lineTo(sx(px),sy(py));ctx.stroke()}ctx.setLineDash([]);function dot(x,y,color,label){ctx.fillStyle=color;ctx.beginPath();ctx.arc(sx(x),sy(y),7,0,Math.PI*2);ctx.fill();ctx.font='bold 19px sans-serif';ctx.fillText(label,sx(x)+11,sy(y)-11)}dot(s.x1,s.y1,'#db3545','F₁');dot(s.x2,s.y2,'#db3545','F₂');dot(px,py,'#15996d','P');const d1=Math.hypot(px-s.x1,py-s.y1),d2=Math.hypot(px-s.x2,py-s.y2);$('measure').textContent='PF₁ = '+fmt(d1)+'、PF₂ = '+fmt(d2)+'　→　'+(s.kind==='ellipse'?'和 = '+fmt(d1+d2):'差の絶対値 = '+fmt(Math.abs(d1-d2)));$('equation').textContent='中心 ('+fmt(s.cx)+', '+fmt(s.cy)+') ／ a = '+fmt(s.a)+'、b = '+fmt(s.b)+'、c = '+fmt(s.c);$('explain').textContent=s.kind==='ellipse'?'楕円：PF₁ + PF₂ = '+fmt(s.D)+'。曲線上のどこでも距離の和が一定です。':'双曲線：|PF₁ − PF₂| = '+fmt(s.D)+'。左右の枝のどこでも距離の差の絶対値が一定です。'}
function update(){try{state=calc();$('error').textContent='';render()}catch(e){$('error').textContent=e.message;state=null;ctx.clearRect(0,0,cv.width,cv.height);$('measure').textContent='';$('equation').textContent='';$('explain').textContent=''}}$('draw').addEventListener('click',update);$('angle').addEventListener('input',render);$('kind').addEventListener('change',()=>{$('distanceLabel').firstChild.textContent=$('kind').value==='ellipse'?'距離の和 PF₁+PF₂':'距離の差 |PF₁−PF₂|';$('d').value=$('kind').value==='ellipse'?'10':'4';update()});$('reset').addEventListener('click',()=>{for(const [id,v] of Object.entries({x1:-3,y1:0,x2:3,y2:0,d:10,angle:90}))$(id).value=v;$('kind').value='ellipse';$('distanceLabel').firstChild.textContent='距離の和 PF₁+PF₂';update()});update();
</script></body></html>
