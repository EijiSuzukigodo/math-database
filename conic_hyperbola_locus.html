<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双曲線の軌跡を1点ずつ描く | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f3f7fc;color:#17324d}header{background:#17365d;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:1.5rem;margin:8px 0}h2{font-size:1.15rem}label{display:block;margin:10px 0}input[type=range]{width:100%;max-width:500px}button{background:#17649b;color:white;border:0;border-radius:9px;padding:11px 17px;margin:4px;font-size:16px;cursor:pointer}button.secondary{background:#546b80}canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #cad8e5;border-radius:10px;touch-action:pan-y}.muted{color:#526579}.value{font-weight:bold;color:#12609b}a{color:#17649b}#status{font-weight:bold;min-height:2em}</style></head><body><header><div style="max-width:900px;margin:auto"><a href="high_school.html" style="color:white">← 高校数学の目次へ</a><h1>双曲線の軌跡を1点ずつ描く</h1><div>2焦点からの距離の差の絶対値が一定</div></div></header><main><section class="panel"><h2>条件を変えてみよう</h2><label>焦点の中心からの距離 c：<span class="value" id="cv"></span><input id="c" type="range" min="1" max="5" step="0.1" value="3"></label><label>距離の差 |PF₁−PF₂| = 2a：<span class="value" id="av"></span><input id="a" type="range" min="1" max="9" step="0.2" value="4"></label><p><strong>|PF₁ − PF₂| = 2a（0 &lt; 2a &lt; F₁F₂）</strong></p><p id="status" aria-live="polite"></p><button id="play">▶ 少しずつ描く</button><button id="pause" class="secondary">一時停止</button><button id="reset" class="secondary">最初に戻す</button><label>描く速さ：<select id="speed"><option value="1">ゆっくり</option><option value="3" selected>ふつう</option><option value="8">速く</option></select></label><p class="muted" id="progress">進行状況：0%</p></section><section class="panel"><canvas id="graph" width="820" height="560" aria-label="座標平面上に2次曲線を徐々に描くグラフ"></canvas><p class="muted">青：曲線　赤：焦点　緑：準線・補助線　橙：動いている点P</p></section><section class="panel"><h2>考えてみよう</h2><p id="explain"></p><p>条件を変えてから「少しずつ描く」を押すと、新しい曲線の点が順に現れます。インターネット接続なしでも動作します。</p></section></main><script>
(()=>{'use strict';const MODE='hyperbola',canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,S=36,cx=W/2,cy=H/2;const $=id=>document.getElementById(id);let pts=[],n=0,playing=false,frame=0;const num=id=>Number($(id).value);function point(x,y){return [cx+x*S,cy-y*S]}function dot(x,y,color,r=5){let [u,v]=point(x,y);ctx.fillStyle=color;ctx.beginPath();ctx.arc(u,v,r,0,Math.PI*2);ctx.fill()}function line(x1,y1,x2,y2,color='#86b8a5',dash=[]){ctx.strokeStyle=color;ctx.lineWidth=1.7;ctx.setLineDash(dash);ctx.beginPath();let a=point(x1,y1),b=point(x2,y2);ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([])}function label(s,x,y){let p=point(x,y);ctx.font='15px sans-serif';ctx.fillStyle='#314b64';ctx.fillText(s,p[0]+7,p[1]-7)}function build(){pts=[];let explain='';if(MODE==='ellipse'){let c=num('c'),a=num('a')/2;$('cv').textContent=c.toFixed(1);$('av').textContent=(2*a).toFixed(1);if(a<=c){$('status').textContent='距離の和は焦点間の距離より大きくしてください。';return false}let b=Math.sqrt(a*a-c*c);for(let i=0;i<=720;i++){let t=2*Math.PI*i/720;pts.push([a*Math.cos(t),b*Math.sin(t)])}explain=`焦点 F₁=(-${c.toFixed(1)},0), F₂=(${c.toFixed(1)},0)。点Pから2焦点への距離の和は常に${(2*a).toFixed(1)}です。`}else if(MODE==='hyperbola'){let c=num('c'),a=num('a')/2;$('cv').textContent=c.toFixed(1);$('av').textContent=(2*a).toFixed(1);if(a>=c){$('status').textContent='距離の差は焦点間の距離より小さくしてください。';return false}let b=Math.sqrt(c*c-a*a);for(let branch of [1,-1]){for(let i=0;i<=360;i++){let t=-2.2+4.4*i/360;pts.push([branch*a*Math.cosh(t),b*Math.sinh(t)])}pts.push(null)}explain=`焦点 F₁=(-${c.toFixed(1)},0), F₂=(${c.toFixed(1)},0)。2焦点への距離の差の絶対値は常に${(2*a).toFixed(1)}です。`}else if(MODE==='parabola'){let p=num('p');$('pv').textContent=p.toFixed(1);for(let i=0;i<=720;i++){let x=-10+20*i/720;pts.push([x,x*x/(4*p)])}explain=`焦点は F=(0,${p.toFixed(1)})、準線は y=${(-p).toFixed(1)}。点Pから焦点までの距離と準線までの距離は等しくなります。`}else{let e=num('e'),a=3;$('ev').textContent=e.toFixed(2);if(Math.abs(e-1)<0.00001){for(let i=0;i<=720;i++){let x=-10+20*i/720;pts.push([x,x*x/(4*a)])}explain='e=1 は放物線です（代表例を表示）。'}else if(e<1){let b=a*Math.sqrt(1-e*e);for(let i=0;i<=720;i++){let t=2*Math.PI*i/720;pts.push([a*Math.cos(t),b*Math.sin(t)])}explain=e===0?'e=0 は円（楕円の特別な場合）です。':'0<e<1 は楕円です。eが1に近づくほど細長くなります。'}else{let b=a*Math.sqrt(e*e-1);for(let branch of [1,-1]){for(let i=0;i<=360;i++){let t=-2+4*i/360;pts.push([branch*a*Math.cosh(t),b*Math.sinh(t)])}pts.push(null)}explain='e>1 は双曲線です。eの変化で開き方が変わります。'}}$('status').textContent='条件が成立しています。描画を開始できます。';$('explain').textContent=explain;return true}function render(){ctx.clearRect(0,0,W,H);ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e6edf3';ctx.lineWidth=1;for(let x=-11;x<=11;x++){let [u]=point(x,0);ctx.beginPath();ctx.moveTo(u,0);ctx.lineTo(u,H);ctx.stroke()}for(let y=-8;y<=8;y++){let [,v]=point(0,y);ctx.beginPath();ctx.moveTo(0,v);ctx.lineTo(W,v);ctx.stroke()}line(-11,0,11,0,'#71869a');line(0,-8,0,8,'#71869a');label('x',10.5,-.3);label('y',.2,7.2);if(MODE==='ellipse'||MODE==='hyperbola'){let c=num('c');dot(-c,0,'#d64747');dot(c,0,'#d64747');label('F₁',-c,0);label('F₂',c,0)}if(MODE==='parabola'){let p=num('p');dot(0,p,'#d64747');label('F',0,p);line(-11,-p,11,-p,'#339b6b',[8,5]);label('準線',-10,-p)}if(MODE==='eccentricity'){let e=num('e');if(e!==1){let c=3*e;dot(-c,0,'#d64747');dot(c,0,'#d64747')}}ctx.lineWidth=3;ctx.strokeStyle='#1767b0';ctx.beginPath();let started=false;for(let i=0;i<Math.min(n,pts.length);i++){let p=pts[i];if(!p){started=false;continue}let [u,v]=point(...p);if(!started){ctx.moveTo(u,v);started=true}else ctx.lineTo(u,v)}ctx.stroke();let last=null;for(let i=Math.min(n,pts.length)-1;i>=0;i--){if(pts[i]){last=pts[i];break}}if(last){dot(...last,'#e68a1d',6);label('P',...last);if(MODE==='ellipse'||MODE==='hyperbola'){let c=num('c');line(...last,-c,0,'#f0a85c',[5,5]);line(...last,c,0,'#f0a85c',[5,5])}if(MODE==='parabola'){let p=num('p');line(...last,0,p,'#f0a85c',[5,5]);line(last[0],last[1],last[0],-p,'#339b6b',[5,5])}}$('progress').textContent='進行状況：'+(pts.length?Math.round(100*n/pts.length):0)+'%'}function restart(){playing=false;n=0;build();render()}function tick(){if(playing){n=Math.min(pts.length,n+Number($('speed').value)*2);if(n>=pts.length)playing=false;render()}requestAnimationFrame(tick)}document.querySelectorAll('input').forEach(el=>el.addEventListener('input',restart));$('play').onclick=()=>{if(!pts.length)restart();if(pts.length){if(n>=pts.length)n=0;playing=true}};$('pause').onclick=()=>{playing=!playing&&n<pts.length;$('pause').textContent=playing?'一時停止':'再開'};$('reset').onclick=restart;restart();requestAnimationFrame(tick);
})();</script></body></html>
