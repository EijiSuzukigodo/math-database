<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式データベース｜みんなの数学データベース</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#193554;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#17365d;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header a{color:white;text-decoration:none}.brand{font-size:1.18rem;font-weight:800}.hero{background:linear-gradient(120deg,#17365d,#2764a5);color:white;padding:38px 20px;text-align:center}.hero h1{margin:0 0 10px;font-size:clamp(1.5rem,4vw,2.4rem)}.hero p{margin:0 0 18px}.count{font-size:1.25rem;font-weight:800;background:#ffffff20;display:inline-block;border:1px solid #ffffff80;border-radius:99px;padding:9px 24px}main{max-width:1080px;margin:auto;padding:25px 16px 60px}.controls{background:white;border:1px solid #dce4ed;border-radius:16px;padding:16px;margin-bottom:18px}input{width:100%;padding:15px;font-size:1rem;border:1px solid #b7c7d9;border-radius:10px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{background:#e8f1fb;color:#17365d;border:1px solid #c9d9ea;border-radius:99px;padding:9px 13px;font-size:.93rem;cursor:pointer}button.active{background:#17365d;color:white}.status{font-size:.93rem;color:#526a84;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.card{background:white;border:1px solid #dfe6ed;border-radius:16px;padding:20px;box-shadow:0 4px 14px #17365d0b}.cat{font-size:.8rem;color:#32649a;font-weight:700}.card h2{font-size:1.1rem;margin:9px 0 12px}.formula{background:#eaf3fd;padding:16px 12px;border-radius:9px;font-size:1.05rem;font-weight:700;overflow-wrap:anywhere;line-height:1.7}.example{margin-top:14px;font-size:.92rem;line-height:1.7}.example strong{color:#315b8d}footer{text-align:center;padding:30px;color:#60748b}footer a{color:#275c93}@media(max-width:500px){.hero{padding:30px 16px}.card{padding:16px}}
</style></head><body><header><a class="brand" href="index.html">∑ みんなの数学データベース</a></header><section class="hero"><h1>公式データベース</h1><p>高校数学から大学数学の基礎まで。公式と計算例を調べられます。</p><div class="count" id="total">全43公式</div></section><main><section class="controls"><label for="search"><strong>公式を検索</strong></label><input id="search" type="search" placeholder="例：微分、三角関数、積分、数列" autocomplete="off"><nav id="filters" aria-label="分野で絞り込む"></nav></section><p class="status" id="status" aria-live="polite"></p><div class="grid" id="cards"></div></main><footer><a href="index.html">トップページに戻る</a><p>みんなの数学データベース · 公式集43件版</p></footer><script>
const items=[{"category": "数と式", "title": "展開公式", "formula": "(a+b)² = a²+2ab+b²", "example": "(x+3)² = x²+6x+9"}, {"category": "数と式", "title": "平方差", "formula": "(a+b)(a−b) = a²−b²", "example": "(x+4)(x−4) = x²−16"}, {"category": "数と式", "title": "二次方程式の解の公式", "formula": "x = (−b ± √(b²−4ac))/(2a)  （a≠0）", "example": "x²−5x+6=0 → x=2, 3"}, {"category": "数と式", "title": "因数分解", "formula": "a²+2ab+b² = (a+b)²", "example": "x²+6x+9 = (x+3)²"}, {"category": "数と式", "title": "指数法則①", "formula": "aᵐaⁿ = aᵐ⁺ⁿ", "example": "2³×2⁴ = 2⁷ = 128"}, {"category": "数と式", "title": "指数法則②", "formula": "(aᵐ)ⁿ = aᵐⁿ", "example": "(2³)² = 2⁶ = 64"}, {"category": "数と式", "title": "対数の積", "formula": "logₐ(MN) = logₐM + logₐN", "example": "log₁₀(100×10) = 2+1 = 3"}, {"category": "数と式", "title": "対数のべき", "formula": "logₐ(Mᵏ) = k logₐM", "example": "log₂(8²) = 2×3 = 6"}, {"category": "二次関数", "title": "頂点形式", "formula": "y = a(x−p)²+q", "example": "y=(x−2)²+1 の頂点は (2,1)"}, {"category": "二次関数", "title": "平方完成", "formula": "x²+bx = (x+b/2)²−b²/4", "example": "x²+4x = (x+2)²−4"}, {"category": "二次関数", "title": "判別式", "formula": "D = b²−4ac", "example": "x²−4x+4=0 → D=0（重解）"}, {"category": "三角関数", "title": "三平方の定理", "formula": "a²+b² = c²（直角三角形）", "example": "3²+4²=5²"}, {"category": "三角関数", "title": "三角比の基本関係", "formula": "sin²θ+cos²θ=1", "example": "sinθ=3/5, cosθ=4/5 なら 9/25+16/25=1"}, {"category": "三角関数", "title": "正接の定義", "formula": "tanθ = sinθ/cosθ（cosθ≠0）", "example": "θ=π/4 → tanθ=1"}, {"category": "三角関数", "title": "正弦定理", "formula": "a/sin A = b/sin B = c/sin C = 2R", "example": "R=5, A=30° → a=5"}, {"category": "三角関数", "title": "余弦定理", "formula": "c² = a²+b²−2ab cos C", "example": "a=b=2, C=60° → c=2"}, {"category": "三角関数", "title": "正弦の加法定理", "formula": "sin(α+β)=sinα cosβ+cosα sinβ", "example": "sin(30°+60°)=1"}, {"category": "三角関数", "title": "余弦の加法定理", "formula": "cos(α+β)=cosα cosβ−sinα sinβ", "example": "cos(60°+30°)=0"}, {"category": "三角関数", "title": "倍角公式", "formula": "sin 2θ = 2sinθ cosθ", "example": "θ=30° → sin60°=√3/2"}, {"category": "数列", "title": "等差数列の一般項", "formula": "aₙ = a₁+(n−1)d", "example": "a₁=2, d=3 → a₅=14"}, {"category": "数列", "title": "等差数列の和", "formula": "Sₙ = n(a₁+aₙ)/2", "example": "1+2+3+4+5=15"}, {"category": "数列", "title": "等比数列の一般項", "formula": "aₙ = a₁rⁿ⁻¹", "example": "a₁=2, r=3 → a₄=54"}, {"category": "数列", "title": "等比数列の和", "formula": "Sₙ = a₁(1−rⁿ)/(1−r)（r≠1）", "example": "1+2+4+8=15"}, {"category": "確率・統計", "title": "順列", "formula": "ₙPᵣ = n!/(n−r)!", "example": "₅P₂ = 5×4=20"}, {"category": "確率・統計", "title": "組合せ", "formula": "ₙCᵣ = n!/[r!(n−r)!]", "example": "₅C₂ = 10"}, {"category": "確率・統計", "title": "余事象の確率", "formula": "P(Aᶜ)=1−P(A)", "example": "P(A)=0.3 → P(Aᶜ)=0.7"}, {"category": "確率・統計", "title": "期待値", "formula": "E(X)=Σ xᵢpᵢ", "example": "1と3が各1/2 → E(X)=2"}, {"category": "確率・統計", "title": "分散", "formula": "V(X)=E(X²)−[E(X)]²", "example": "1と3が各1/2 → V(X)=1"}, {"category": "ベクトル", "title": "ベクトルの内積", "formula": "a·b = |a||b|cosθ", "example": "(1,2)·(3,4)=11"}, {"category": "ベクトル", "title": "平面ベクトルの長さ", "formula": "|(x,y)|=√(x²+y²)", "example": "|(3,4)|=5"}, {"category": "微分", "title": "べき関数の微分", "formula": "(xⁿ)′ = nxⁿ⁻¹", "example": "(x³)′=3x²"}, {"category": "微分", "title": "和の微分", "formula": "(f+g)′=f′+g′", "example": "(x²+3x)′=2x+3"}, {"category": "微分", "title": "積の微分", "formula": "(fg)′=f′g+fg′", "example": "(x²sin x)′=2x sin x+x²cos x"}, {"category": "微分", "title": "商の微分", "formula": "(f/g)′=(f′g−fg′)/g²（g≠0）", "example": "(x/(x+1))′=1/(x+1)²"}, {"category": "微分", "title": "合成関数の微分", "formula": "(f(g(x)))′=f′(g(x))g′(x)", "example": "((x²+1)³)′=6x(x²+1)²"}, {"category": "微分", "title": "三角関数の微分", "formula": "(sin x)′=cos x", "example": "(3sin x)′=3cos x"}, {"category": "微分", "title": "指数関数の微分", "formula": "(eˣ)′=eˣ", "example": "(2eˣ)′=2eˣ"}, {"category": "微分", "title": "対数関数の微分", "formula": "(ln x)′=1/x（x>0）", "example": "(3ln x)′=3/x"}, {"category": "積分", "title": "べき関数の不定積分", "formula": "∫xⁿ dx = xⁿ⁺¹/(n+1)+C（n≠−1）", "example": "∫x² dx=x³/3+C"}, {"category": "積分", "title": "1/x の不定積分", "formula": "∫(1/x)dx=ln|x|+C（x≠0）", "example": "∫(2/x)dx=2ln|x|+C"}, {"category": "積分", "title": "定積分の基本定理", "formula": "∫ₐᵇ f(x)dx = F(b)−F(a)（F′=f）", "example": "∫₀² 2x dx = [x²]₀²=4"}, {"category": "大学数学", "title": "部分積分", "formula": "∫u dv = uv−∫v du", "example": "∫x eˣ dx = (x−1)eˣ+C"}, {"category": "大学数学", "title": "行列式（2×2）", "formula": "det [[a,b],[c,d]] = ad−bc", "example": "det [[1,2],[3,4]] = −2"}];
const filters=document.getElementById('filters'), cards=document.getElementById('cards'),search=document.getElementById('search'),status=document.getElementById('status');let active='すべて';
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const cats=['すべて',...new Set(items.map(x=>x.category))];
function render(){filters.innerHTML=cats.map(c=>`<button type="button" data-cat="${escapeHtml(c)}" class="${active===c?'active':''}" aria-pressed="${active===c}">${escapeHtml(c)}</button>`).join('');const q=search.value.trim().toLowerCase();const list=items.filter(x=>(active==='すべて'||x.category===active)&&[x.category,x.title,x.formula,x.example].join(' ').toLowerCase().includes(q));status.textContent=`表示中：${list.length}件 ／ 全${items.length}公式`;cards.innerHTML=list.length?list.map((x,i)=>`<article class="card"><div class="cat">${escapeHtml(x.category)}</div><h2>${escapeHtml(x.title)}</h2><div class="formula">${escapeHtml(x.formula)}</div><div class="example"><strong>計算例：</strong>${escapeHtml(x.example)}</div></article>`).join(''):'<p>該当する公式はありません。検索語を変えてください。</p>';}
filters.addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(b){active=b.dataset.cat;render();}});search.addEventListener('input',render);document.getElementById('total').textContent=`全${items.length}公式`;render();
</script></body></html>
