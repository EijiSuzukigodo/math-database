</style></head><body><header><a class="brand" href="index.html">∑ みんなの数学データベース</a></header><section class="hero"><h1>公式データベース</h1><p>高校数学から大学数学の基礎まで。公式の意味・計算例・途中式・証明を調べられます。</p><div class="count" id="total">全43公式</div></section><main><section class="controls"><label for="search"><strong>公式を検索</strong></label><input id="search" type="search" placeholder="例：微分、三角関数、積分、数列" autocomplete="off"><nav id="filters" aria-label="分野で絞り込む"></nav></section><p class="status" id="status" aria-live="polite"></p><div class="grid" id="cards"></div></main><footer><a href="index.html">トップページに戻る</a><p>みんなの数学データベース · 公式集43件・証明追加版</p></footer><script>
const items=[{"category":"数と式","title":"展開公式","formula":"(a+b)² = a²+2ab+b²","example":"(x+3)² = x²+6x+9","explanation":"2つの項の和を2乗すると、両方の2乗に加えて積の2倍が現れます。","steps":"(x+3)(x+3) = x²+3x+3x+9 = x²+6x+9","proof":"分配法則より (a+b)(a+b)=a²+ab+ba+b²=a²+2ab+b²。"},{"category":"数と式","title":"平方差","formula":"(a+b)(a−b) = a²−b²","example":"(x+4)(x−4) = x²−16","explanation":"和と差を掛けると中央の項が打ち消し合います。","steps":"(x+4)(x−4) = x²−4x+4x−16 = x²−16","proof":"分配法則で (a+b)(a−b)=a²−ab+ab−b²=a²−b²。"},{"category":"数と式","title":"二次方程式の解の公式","formula":"x = (−b ± √(b²−4ac))/(2a)  （a≠0）","example":"x²−5x+6=0 → x=2, 3","explanation":"ax²+bx+c=0 の解を係数から求めます。","steps":"a=1, b=−5, c=6 とすると、x=(5±√25−24)/2=(5±1)/2。よって x=2,3","proof":"ax²+bx+c=0 を a で割り、x²+(b/a)x=−c/a。平方完成して (x+b/(2a))²=(b²−4ac)/(4a²)。平方根を取ると x=(−b±√(b²−4ac))/(2a)。実数解には判別式が0以上であることが必要。"},{"category":"数と式","title":"因数分解","formula":"a²+2ab+b² = (a+b)²","example":"x²+6x+9 = (x+3)²","explanation":"完全平方の形を見つけて因数分解します。","steps":"x²+6x+9 = x²+2·x·3+3² = (x+3)²","proof":"展開公式 (a+b)²=a²+2ab+b² の左右を入れ替えた等式です。"},{"category":"数と式","title":"指数法則①","formula":"aᵐaⁿ = aᵐ⁺ⁿ","example":"2³×2⁴ = 2⁷ = 128","explanation":"同じ底の累乗の積では指数を足します。","steps":"2³×2⁴ = (2×2×2)×(2×2×2×2)=2⁷=128","proof":"自然数 m,n では a を m 個掛けた積と n 個掛けた積をつなげると、a が m+n 個並びます。整数指数へは a≠0 のもとで拡張できます。"},{"category":"数と式","title":"指数法則②","formula":"(aᵐ)ⁿ = aᵐⁿ","example":"(2³)² = 2⁶ = 64","explanation":"累乗をさらに累乗すると指数を掛けます。","steps":"(2³)² = 2³×2³ = 2⁶ = 64","proof":"自然数 m,n では (aᵐ)ⁿ は aᵐ を n 回掛けるため、a が mn 個並びます。整数指数への拡張では a≠0 とします。"},{"category":"数と式","title":"対数の積","formula":"logₐ(MN) = logₐM + logₐN","example":"log₁₀(100×10) = 2+1 = 3","explanation":"正の数の積の対数は、各対数の和になります（底は正で1以外）。","steps":"log₁₀(100×10)=log₁₀100+log₁₀10=2+1=3","proof":"M=aˣ、N=aʸ と置くと MN=aˣaʸ=aˣ⁺ʸ。両辺の底 a の対数を取れば logₐ(MN)=x+y=logₐM+logₐN。条件：a>0、a≠1、M,N>0。"},{"category":"数と式","title":"対数のべき","formula":"logₐ(Mᵏ) = k logₐM","example":"log₂(8²) = 2×3 = 6","explanation":"正の数の累乗の対数では指数を前に出せます。","steps":"log₂(8²)=2log₂8=2×3=6","proof":"M=aˣ と置くと Mᵏ=aᵏˣ。よって logₐ(Mᵏ)=kx=k logₐM。条件：a>0、a≠1、M>0（実数 k）。"},{"category":"二次関数","title":"頂点形式","formula":"y = a(x−p)²+q","example":"y=(x−2)²+1 の頂点は (2,1)","explanation":"放物線の頂点を直接読み取れる形です。","steps":"y=(x−2)²+1 では (x−2)²≥0。最小値は1、頂点は(2,1)","proof":"x=p のとき (x−p)²=0 なので y=q。a≠0 なら放物線の対称軸は x=p、頂点は (p,q)。a>0 で最小、a<0 で最大になります。"},{"category":"二次関数","title":"平方完成","formula":"x²+bx = (x+b/2)²−b²/4","example":"x²+4x = (x+2)²−4","explanation":"二次式を平方の形に書き換えます。","steps":"x²+4x = x²+4x+4−4 = (x+2)²−4","proof":"(x+b/2)²=x²+bx+b²/4。両辺から b²/4 を引けば x²+bx=(x+b/2)²−b²/4。"},{"category":"二次関数","title":"判別式","formula":"D = b²−4ac","example":"x²−4x+4=0 → D=0（重解）","explanation":"二次方程式の実数解の個数を調べます。D>0なら2個、D=0なら1個、D<0なら0個です。","steps":"x²−4x+4=0 では D=(−4)²−4·1·4=0。解は x=2（重解）","proof":"解の公式 x=(−b±√D)/(2a) で D=b²−4ac。D>0 は異なる2実数解、D=0 は重解、D<0 は実数解なし。a≠0 とします。"},{"category":"三角関数","title":"三平方の定理","formula":"a²+b² = c²（直角三角形）","example":"3²+4²=5²","explanation":"直角三角形では、斜辺の2乗は他の2辺の2乗の和です。","steps":"辺が3と4なら、斜辺 c=√(3²+4²)=√25=5","proof":"直角三角形の各辺上に正方形を作り、斜辺上の正方形を相似な三角形で分割すると、2つの直角辺上の正方形の面積の和に等しくなります。したがって a²+b²=c²。これは面積による証明の概略です。"},{"category":"三角関数","title":"三角比の基本関係","formula":"sin²θ+cos²θ=1","example":"sinθ=3/5, cosθ=4/5 なら 9/25+16/25=1","explanation":"正弦と余弦の間に成り立つ基本的な関係です。","steps":"sinθ=3/5、cosθ=4/5 なら (3/5)²+(4/5)²=9/25+16/25=1","proof":"単位円上の点を (cosθ,sinθ) とすると、円の方程式 x²+y²=1 に代入して cos²θ+sin²θ=1。"},{"category":"三角関数","title":"正接の定義","formula":"tanθ = sinθ/cosθ（cosθ≠0）","example":"θ=π/4 → tanθ=1","explanation":"正接は正弦を余弦で割った値です。","steps":"θ=45° のとき sinθ=cosθ=√2/2。tanθ=1","proof":"直角三角形で sinθ=対辺/斜辺、cosθ=隣辺/斜辺。したがって sinθ/cosθ=対辺/隣辺=tanθ。一般角にも単位円で拡張します。cosθ≠0。"},{"category":"三角関数","title":"正弦定理","formula":"a/sin A = b/sin B = c/sin C = 2R","example":"R=5, A=30° → a=5","explanation":"三角形の辺と対角の正弦、外接円半径を結びつけます。","steps":"a=2R sinA=2×5×sin30°=10×1/2=5","proof":"三角形の外接円半径を R とすると、辺 a に対応する中心角は円周角 A の2倍（必要に応じて補角を使う）。弦の長さは a=2R sinA。b,c についても同様なので比はすべて2R。"},{"category":"三角関数","title":"余弦定理","formula":"c² = a²+b²−2ab cos C","example":"a=b=2, C=60° → c=2","explanation":"2辺とその間の角から残りの辺を求められます。","steps":"c²=2²+2²−2·2·2·cos60°=8−4=4。よって c=2","proof":"頂点 C を原点、辺 CA を x 軸に置き、A=(b,0)、B=(a cosC,a sinC) とする。距離の公式から c²=(b−a cosC)²+(a sinC)²=a²+b²−2ab cosC。"},{"category":"三角関数","title":"正弦の加法定理","formula":"sin(α+β)=sinα cosβ+cosα sinβ","example":"sin(30°+60°)=1","explanation":"2つの角の和の正弦を、それぞれの正弦・余弦で表します。","steps":"sin(30°+60°)=sin30°cos60°+cos30°sin60°=1/4+3/4=1","proof":"単位円の回転で、角 β の点 (cosβ,sinβ) を角 α だけ回すと y 座標は sinα cosβ+cosα sinβ。一方、回転後の y 座標は sin(α+β)。回転行列の性質を使った導出です。"},{"category":"三角関数","title":"余弦の加法定理","formula":"cos(α+β)=cosα cosβ−sinα sinβ","example":"cos(60°+30°)=0","explanation":"2つの角の和の余弦を、それぞれの正弦・余弦で表します。","steps":"cos(60°+30°)=cos60°cos30°−sin60°sin30°=√3/4−√3/4=0","proof":"単位円の回転で (cosβ,sinβ) を角 α だけ回すと x 座標は cosα cosβ−sinα sinβ。回転後の x 座標は cos(α+β)。"},{"category":"三角関数","title":"倍角公式","formula":"sin 2θ = 2sinθ cosθ","example":"θ=30° → sin60°=√3/2","explanation":"角を2倍にした正弦を元の角で表します。","steps":"sin(2×30°)=2sin30°cos30°=2×1/2×√3/2=√3/2","proof":"正弦の加法定理で α=β=θ とすると sin(θ+θ)=sinθ cosθ+cosθ sinθ=2sinθ cosθ。"},{"category":"数列","title":"等差数列の一般項","formula":"aₙ = a₁+(n−1)d","example":"a₁=2, d=3 → a₅=14","explanation":"一定の差で増減する数列のn番目を求めます。","steps":"a₅=2+(5−1)×3=2+12=14","proof":"各項の差が d なので a₂=a₁+d、a₃=a₁+2d、… と進み、n 番目までに d を n−1 回足すため aₙ=a₁+(n−1)d。"},{"category":"数列","title":"等差数列の和","formula":"Sₙ = n(a₁+aₙ)/2","example":"1+2+3+4+5=15","explanation":"等差数列は最初と最後の項の平均に項数を掛けて求めます。","steps":"S₅=5(1+5)/2=15","proof":"Sₙ=a₁+a₂+…+aₙ を逆順にも書いて足すと 2Sₙ=(a₁+aₙ)+(a₂+aₙ₋₁)+…=n(a₁+aₙ)。よって Sₙ=n(a₁+aₙ)/2。"},{"category":"数列","title":"等比数列の一般項","formula":"aₙ = a₁rⁿ⁻¹","example":"a₁=2, r=3 → a₄=54","explanation":"一定の比で増減する数列のn番目を求めます。","steps":"a₄=2×3⁽⁴⁻¹⁾=2×27=54","proof":"各項は直前の項の r 倍なので a₂=a₁r、a₃=a₁r²、… と進み、aₙ=a₁rⁿ⁻¹。"},{"category":"数列","title":"等比数列の和","formula":"Sₙ = a₁(1−rⁿ)/(1−r)（r≠1）","example":"1+2+4+8=15","explanation":"等比数列の最初のn項の和です。r=1なら Sₙ=na₁ です。","steps":"1+2+4+8 = (1−2⁴)/(1−2)=15","proof":"Sₙ=a₁+a₁r+…+a₁rⁿ⁻¹ とすると rSₙ=a₁r+…+a₁rⁿ。引き算して (1−r)Sₙ=a₁(1−rⁿ)。r≠1 なら両辺を1−rで割ります。"},{"category":"確率・統計","title":"順列","formula":"ₙPᵣ = n!/(n−r)!","example":"₅P₂ = 5×4=20","explanation":"異なるものを順番を区別して選ぶ方法の数です。","steps":"5個から2個を順に選ぶと 5×4=20通り","proof":"最初の席には n 通り、次は n−1 通り、…、r 番目には n−r+1 通り。積の法則で n(n−1)…(n−r+1)=n!/(n−r)!。0≤r≤n。"},{"category":"確率・統計","title":"組合せ","formula":"ₙCᵣ = n!/[r!(n−r)!]","example":"₅C₂ = 10","explanation":"異なるものを順番を区別せずに選ぶ方法の数です。","steps":"5個から2個を選ぶと (5×4)/(2×1)=10通り","proof":"順番を区別した選び方 nPᵣ のうち、同じ r 個の組は r! 通りずつ重複します。したがって nCᵣ=nPᵣ/r!=n!/[r!(n−r)!]。"},{"category":"確率・統計","title":"余事象の確率","formula":"P(Aᶜ)=1−P(A)","example":"P(A)=0.3 → P(Aᶜ)=0.7","explanation":"ある事象が起こらない確率は、1から起こる確率を引きます。","steps":"P(A)=0.3 なら P(Aᶜ)=1−0.3=0.7","proof":"A とその余事象 Aᶜ は重ならず、合わせて標本空間全体です。加法法則から P(A)+P(Aᶜ)=1、よって P(Aᶜ)=1−P(A)。"},{"category":"確率・統計","title":"期待値","formula":"E(X)=Σ xᵢpᵢ","example":"1と3が各1/2 → E(X)=2","explanation":"起こり得る値を、その確率で重み付けした平均です。","steps":"X=1,3 が各1/2なら E(X)=1×1/2+3×1/2=2","proof":"離散確率変数 X が値 xᵢ を確率 pᵢ で取るとき、期待値は確率を重みとした平均として E(X)=Σxᵢpᵢ と定義されます（Σpᵢ=1）。"},{"category":"確率・統計","title":"分散","formula":"V(X)=E(X²)−[E(X)]²","example":"1と3が各1/2 → V(X)=1","explanation":"値のばらつきを表します。二乗の平均から平均の二乗を引きます。","steps":"E(X)=2、E(X²)=(1²+3²)/2=5。V(X)=5−2²=1","proof":"平均 μ=E(X) として V(X)=E[(X−μ)²]。展開すると E(X²−2μX+μ²)=E(X²)−2μE(X)+μ²=E(X²)−μ²。"},{"category":"ベクトル","title":"ベクトルの内積","formula":"a·b = |a||b|cosθ","example":"(1,2)·(3,4)=11","explanation":"2つのベクトルのなす角や直交を調べるのに使います。","steps":"(1,2)·(3,4)=1×3+2×4=3+8=11","proof":"座標軸方向の単位ベクトルが互いに直交することから、成分表示では a·b=a₁b₁+a₂b₂。一方、余弦定理を |a−b|² に適用すると |a−b|²=|a|²+|b|²−2|a||b|cosθ。成分による展開と比較し a·b=|a||b|cosθ を得ます。"},{"category":"ベクトル","title":"平面ベクトルの長さ","formula":"|(x,y)|=√(x²+y²)","example":"|(3,4)|=5","explanation":"成分からベクトルの大きさを計算します。","steps":"|(3,4)|=√(3²+4²)=√25=5","proof":"原点と点 (x,y) を結ぶ線分を斜辺とする直角三角形に三平方の定理を適用すると、長さの2乗は x²+y²。長さは非負なので √(x²+y²)。"},{"category":"微分","title":"べき関数の微分","formula":"(xⁿ)′ = nxⁿ⁻¹","example":"(x³)′=3x²","explanation":"xの整数乗を微分すると、指数を前に掛けて指数を1減らします。","steps":"d(x³)/dx=3x²","proof":"正の整数 n に対し、(x+h)ⁿ の二項展開は xⁿ+nxⁿ⁻¹h+h²を因数にもつ残りの項。差商を取って h→0 とすると nxⁿ⁻¹。負の整数や一般の実数指数への拡張には追加の議論が必要です。"},{"category":"微分","title":"和の微分","formula":"(f+g)′=f′+g′","example":"(x²+3x)′=2x+3","explanation":"和の微分は、それぞれ微分して足します。","steps":"d(x²+3x)/dx=2x+3","proof":"微分の定義で [(f(x+h)+g(x+h))−(f(x)+g(x))]/h を2つの差商に分け、h→0 の極限をそれぞれ取ります。"},{"category":"微分","title":"積の微分","formula":"(fg)′=f′g+fg′","example":"(x²sin x)′=2x sin x+x²cos x","explanation":"2つの関数の積は、それぞれ片方ずつ微分して足します。","steps":"d(x²sin x)/dx=2x sin x+x²cos x","proof":"差商を f(x+h)g(x+h)−f(x)g(x)=[f(x+h)−f(x)]g(x+h)+f(x)[g(x+h)−g(x)] と分ける。h→0 で f′g+fg′（微分可能なら連続）。"},{"category":"微分","title":"商の微分","formula":"(f/g)′=(f′g−fg′)/g²（g≠0）","example":"(x/(x+1))′=1/(x+1)²","explanation":"2つの関数の商の微分です。分母が0でない範囲で使います。","steps":"f=x、g=x+1 とすると (f′g−fg′)/g²=((x+1)−x)/(x+1)²=1/(x+1)²","proof":"f/g=f·(1/g)。逆数の差商より (1/g)′=−g′/g²（g≠0）。積の微分を使うと (f/g)′=f′/g−fg′/g²=(f′g−fg′)/g²。"},{"category":"微分","title":"合成関数の微分","formula":"(f(g(x)))′=f′(g(x))g′(x)","example":"((x²+1)³)′=6x(x²+1)²","explanation":"関数の中に別の関数があるとき、外側と内側を順に微分します。","steps":"u=x²+1 とおくと d(u³)/dx=3u²×2x=6x(x²+1)²","proof":"Δu=g(x+h)−g(x) とおくと、合成関数の差商は [f(u+Δu)−f(u)]/Δu × Δu/h。微分可能性を用いて極限を取ると f′(g(x))g′(x)。Δu=0 の場合も微分可能性による線形近似で扱えます。"},{"category":"微分","title":"三角関数の微分","formula":"(sin x)′=cos x","example":"(3sin x)′=3cos x","explanation":"角度をラジアンで表したときの正弦の微分です。","steps":"d(3sin x)/dx=3cos x","proof":"加法定理より sin(x+h)=sinx cosh+cosx sinh。差商は sinx(cosh−1)/h+cosx(sinh/h)。ラジアンで lim(h→0)(cosh−1)/h=0、lim(h→0)sinh/h=1 より cosx。"},{"category":"微分","title":"指数関数の微分","formula":"(eˣ)′=eˣ","example":"(2eˣ)′=2eˣ","explanation":"自然指数関数 eˣ は微分しても形が変わりません。","steps":"d(2eˣ)/dx=2eˣ","proof":"eˣ の定義と指数法則により [eˣ⁺ʰ−eˣ]/h=eˣ(eʰ−1)/h。自然対数の底 e の性質から lim(h→0)(eʰ−1)/h=1 なので導関数は eˣ。"},{"category":"微分","title":"対数関数の微分","formula":"(ln x)′=1/x（x>0）","example":"(3ln x)′=3/x","explanation":"自然対数 ln x の微分です。実数では x>0 の範囲で考えます。","steps":"d(3ln x)/dx=3/x","proof":"ln x は eˣ の逆関数。y=ln x なら eʸ=x。両辺を微分して eʸ y′=1。eʸ=x より y′=1/x（x>0）。"},{"category":"積分","title":"べき関数の不定積分","formula":"∫xⁿ dx = xⁿ⁺¹/(n+1)+C（n≠−1）","example":"∫x² dx=x³/3+C","explanation":"xの累乗を積分すると指数を1増やしてその指数で割ります。","steps":"∫x²dx=x³/3+C。微分すると x² に戻ります","proof":"微分公式 d[xⁿ⁺¹/(n+1)]/dx=xⁿ（n≠−1）を逆に使います。不定積分は原始関数全体なので積分定数 C を加えます。"},{"category":"積分","title":"1/x の不定積分","formula":"∫(1/x)dx=ln|x|+C（x≠0）","example":"∫(2/x)dx=2ln|x|+C","explanation":"1/x の原始関数は ln|x| です。x=0をまたがない区間で使います。","steps":"∫(2/x)dx=2ln|x|+C","proof":"x>0 で (ln x)′=1/x。x<0 では ln|x|=ln(−x) なので合成関数の微分により (ln|x|)′=(1/(−x))×(−1)=1/x。0を含まない区間で成り立ちます。"},{"category":"積分","title":"定積分の基本定理","formula":"∫ₐᵇ f(x)dx = F(b)−F(a)（F′=f）","example":"∫₀² 2x dx = [x²]₀²=4","explanation":"定積分は原始関数の上端と下端の値の差で求めます。","steps":"∫₀²2x dx=[x²]₀²=2²−0²=4","proof":"微積分学の基本定理により、連続な f の原始関数 F に対して ∫ₐᵇ f(x)dx=F(b)−F(a)。導出の要点：G(x)=∫ₐˣf(t)dt と置くと G′(x)=f(x) で、G と F の差は定数になります。"},{"category":"大学数学","title":"部分積分","formula":"∫u dv = uv−∫v du","example":"∫x eˣ dx = (x−1)eˣ+C","explanation":"積の微分公式を逆向きに利用する積分法です。","steps":"u=x、dv=eˣdx とすると du=dx、v=eˣ。∫xeˣdx=xeˣ−∫eˣdx=(x−1)eˣ+C","proof":"積の微分 (uv)′=u′v+uv′ を積分して uv=∫v du+∫u dv。移項すると ∫u dv=uv−∫v du（積分定数はまとめて扱います）。"},{"category":"大学数学","title":"行列式（2×2）","formula":"det [[a,b],[c,d]] = ad−bc","example":"det [[1,2],[3,4]] = −2","explanation":"2行2列の行列式は左上×右下から右上×左下を引きます。","steps":"det[[1,2],[3,4]]=1×4−2×3=4−6=−2","proof":"2×2 行列の行列式は、単位正方形が列ベクトル (a,c),(b,d) により写る際の符号付き面積として ad−bc と定義できます。代数的には行列式の交代性と多重線形性から det[[a,b],[c,d]]=ad−bc。"}];
const filters=document.getElementById('filters'), cards=document.getElementById('cards'),search=document.getElementById('search'),status=document.getElementById('status');let active='すべて';
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const cats=['すべて',...new Set(items.map(x=>x.category))];
function render(){filters.innerHTML=cats.map(c=>`<button type="button" data-cat="${escapeHtml(c)}" class="${active===c?'active':''}" aria-pressed="${active===c}">${escapeHtml(c)}</button>`).join('');const q=search.value.trim().toLowerCase();const list=items.filter(x=>(active==='すべて'||x.category===active)&&[x.category,x.title,x.formula,x.example,x.explanation,x.steps,x.proof].join(' ').toLowerCase().includes(q));status.textContent=`表示中：${list.length}件 ／ 全${items.length}公式`;cards.innerHTML=list.length?list.map((x,i)=>`<article class="card"><div class="cat">${escapeHtml(x.category)}</div><h2>${escapeHtml(x.title)}</h2><div class="formula">${escapeHtml(x.formula)}</div><div class="explain"><strong>公式の意味：</strong>${escapeHtml(x.explanation)}</div><div class="example"><strong>計算例：</strong>${escapeHtml(x.example)}</div><details class="detail"><summary>途中式・詳しい計算を見る</summary><p class="step">${escapeHtml(x.steps)}</p></details><details class="detail proof"><summary>証明・導き方を見る</summary><p class="step">${escapeHtml(x.proof)}</p></details></article>`).join(''):'<p>該当する公式はありません。検索語を変えてください。</p>';}
filters.addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(b){active=b.dataset.cat;render();}});search.addEventListener('input',render);document.getElementById('total').textContent=`全${items.length}公式`;render();
</script></body></html>
