<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二項分布と期待値を動かして理解する | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#1c3048;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#17365d;color:white;padding:20px}main{max-width:900px;margin:auto;padding:18px}section{background:white;border:1px solid #dbe5ef;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d}label{display:block;font-weight:700;margin:12px 0 4px}input[type=range]{width:min(420px,75%);vertical-align:middle}input[type=number],select{font-size:17px;padding:8px;border:1px solid #aac0d6;border-radius:8px;max-width:120px}button{padding:10px 16px;border:0;border-radius:8px;background:#245b91;color:white;font-size:16px}canvas{width:100%;height:auto;border:1px solid #e0e7f0;border-radius:10px;background:#fff}output,.result{display:block;background:#eaf3ff;padding:12px;border-radius:10px;margin:12px 0;font-weight:600;white-space:pre-wrap}.muted{color:#536579}a{color:#fff}</style></head><body><header><a href="high_school.html">← 高校数学へ戻る</a><h1>二項分布と期待値を動かして理解する</h1><div>みんなの数学データベース｜動かして理解する高校数学</div></header><main><section><h2>① 試行回数と成功確率を動かす</h2><label>試行回数 n：<input id="n" type="range" min="1" max="30" value="10"> <span id="nv"></span></label><label>成功確率 p：<input id="p" type="range" min="0" max="100" value="40"> <span id="pv"></span></label><label>注目する成功回数 k：<input id="k" type="range" min="0" max="10" value="4"> <span id="kv"></span></label><canvas id="cv" width="760" height="360"></canvas><div class="result" id="result" aria-live="polite"></div></section><section><h2>② 公式を確かめよう</h2><p>成功回数 X が二項分布 B(n,p) に従うとき、P(X=k) = nCk × pᵏ × (1−p)ⁿ⁻ᵏ です。</p><p>期待値 E(X)=np、分散 V(X)=np(1−p) となります。</p><p class="muted">棒の高さは各成功回数の確率です。オレンジ色の棒が選択した k を表します。</p></section></main><script>const $=id=>document.getElementById(id),c=$('cv'),g=c.getContext('2d');function comb(n,k){let v=1;for(let i=1;i<=k;i++)v=v*(n-i+1)/i;return v}function update(){let n=+$('n').value,p=+$('p').value/100,kEl=$('k');kEl.max=n;if(+kEl.value>n)kEl.value=n;let k=+kEl.value;$('nv').textContent=n;$('pv').textContent=(p*100).toFixed(0)+'%';$('kv').textContent=k;let probs=Array.from({length:n+1},(_,j)=>comb(n,j)*Math.pow(p,j)*Math.pow(1-p,n-j)),max=Math.max(...probs,.01);g.clearRect(0,0,760,360);g.strokeStyle='#a9b8c7';g.beginPath();g.moveTo(48,20);g.lineTo(48,310);g.lineTo(740,310);g.stroke();g.font='12px sans-serif';g.fillStyle='#42536b';for(let t=0;t<=4;t++){let v=max*t/4,y=310-v/max*270;g.fillText(v.toFixed(2),4,y+4);g.strokeStyle='#e8edf3';g.beginPath();g.moveTo(48,y);g.lineTo(740,y);g.stroke()}let bw=680/(n+1);probs.forEach((v,j)=>{let x=54+j*bw,h=v/max*270;g.fillStyle=j===k?'#e28b35':'#3578b9';g.fillRect(x,310-h,Math.max(2,bw-3),h);if(n<=15||j%Math.ceil(n/15)===0){g.fillStyle='#42536b';g.fillText(j,x,330)}});$('result').textContent=`P(X=${k}) = ${probs[k].toFixed(6)}\n期待値 E(X) = ${(n*p).toFixed(3)}\n分散 V(X) = ${(n*p*(1-p)).toFixed(3)}`;}['n','p','k'].forEach(id=>$(id).oninput=update);update();</script></body></html>
