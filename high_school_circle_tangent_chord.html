<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>円の性質と接弦定理 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:20px}main{max-width:950px;margin:24px auto;padding:0 16px 60px}a{color:#245b91}header a{color:white}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d;font-size:1.2rem}svg{width:100%;height:auto;max-height:480px;background:#fcfdff;border:1px solid #dae4ee;border-radius:10px;touch-action:none}input[type=range]{width:100%}label{display:block;margin:12px 0}button{padding:9px 15px;border:1px solid #9ab0c6;background:#eaf2fc;border-radius:9px;color:#17365d;font-weight:bold;cursor:pointer}button:focus-visible{outline:3px solid #397bce}.buttons{display:flex;flex-wrap:wrap;gap:8px}.math{background:#eef5ff;border-radius:9px;padding:12px;overflow-wrap:anywhere}small,.muted{color:#52657d}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dce5ef;padding:6px;text-align:center} .scroll{overflow:auto}</style></head><body><header><div style="max-width:950px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>円の性質と接弦定理</h1><div>数学A・図形の性質｜図を動かして理解する</div></div></header><main><section class="panel"><h2>円周角と中心角</h2><label>点Bの角度：<output id="bv"></output>°<input id="b" type="range" min="20" max="160" value="85"></label><label>点Pの角度：<output id="pv"></output>°<input id="pt" type="range" min="190" max="350" value="270"></label><svg id="circle" viewBox="0 0 600 430" role="img" aria-label="円周角と中心角の関係"></svg><div class="math" id="angles"></div><p>青い中心角 ∠AOB と、赤い円周角 ∠APB を比べましょう。点Pを動かしても、同じ弧ABに対する円周角は変わりません。</p></section><section class="panel"><h2>接弦定理</h2><label>弦の端点B：<output id="tv"></output>°<input id="t" type="range" min="20" max="160" value="70"></label><svg id="tangent" viewBox="0 0 600 430" role="img" aria-label="接線と弦と円周角"></svg><div class="math" id="tresult"></div><p>点Aでの接線と弦ABのなす鋭角は、弦ABに対する円周角（適切な側の角）に等しくなります。</p></section><p class="muted">この教材はブラウザだけで動作します。数式・図形は学習用に表示しています。</p></main><script>const ns='http://www.w3.org/2000/svg',cx=300,cy=215,r=145;const pos=a=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];function line(svg,a,b,color,width=3,dash=''){let e=document.createElementNS(ns,'line');for(let [k,v] of Object.entries({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:color,'stroke-width':width,'stroke-dasharray':dash}))e.setAttribute(k,v);svg.appendChild(e)}function text(svg,x,y,s,color='#17365d'){let e=document.createElementNS(ns,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('fill',color);e.setAttribute('font-size','18');e.textContent=s;svg.appendChild(e)}function dot(svg,p,name){let e=document.createElementNS(ns,'circle');e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1]);e.setAttribute('r',5);e.setAttribute('fill','#17365d');svg.appendChild(e);text(svg,p[0]+9,p[1]-9,name)}function base(svg){svg.innerHTML='<circle cx="300" cy="215" r="145" fill="none" stroke="#9eb4cb" stroke-width="3"/>';line(svg,[cx-160,cy],[cx+160,cy],'#e4eaf0',1);line(svg,[cx,cy-160],[cx,cy+160],'#e4eaf0',1)}function angle(a,b,c){let u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]],co=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v));return Math.acos(Math.max(-1,Math.min(1,co)))*180/Math.PI}function draw(){let b=+document.getElementById('b').value,p=+document.getElementById('pt').value,A=pos(0),B=pos(b),P=pos(p),O=[cx,cy],s=document.getElementById('circle');base(s);line(s,O,A,'#2875bd');line(s,O,B,'#2875bd');line(s,P,A,'#d05250');line(s,P,B,'#d05250');dot(s,O,'O');dot(s,A,'A');dot(s,B,'B');dot(s,P,'P');document.getElementById('bv').textContent=b;document.getElementById('pv').textContent=p;document.getElementById('angles').textContent='中心角 ∠AOB = '+b.toFixed(1)+'°　円周角 ∠APB = '+angle(A,P,B).toFixed(1)+'°';let t=+document.getElementById('t').value,T=pos(t),v=document.getElementById('tangent');base(v);line(v,[cx+r,cy-180],[cx+r,cy+180],'#17946e',3);line(v,A,T,'#d05250');line(v,P,A,'#b2c2d3',2);line(v,P,T,'#b2c2d3',2);dot(v,A,'A');dot(v,T,'B');dot(v,P,'P');document.getElementById('tv').textContent=t;document.getElementById('tresult').textContent='接線と弦ABの鋭角 = '+(t/2).toFixed(1)+'°　対応する円周角 ∠APB = '+angle(A,P,T).toFixed(1)+'°'}['b','pt','t'].forEach(id=>document.getElementById(id).addEventListener('input',draw));draw();</script></body></html>
