<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>標本平均と信頼区間 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#20334c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:18px}main{max-width:980px;margin:22px auto;padding:0 14px 50px}h1{font-size:1.5rem}h2{font-size:1.2rem;color:#17365d}.panel{background:white;border:1px solid #d8e3f1;border-radius:14px;padding:16px;margin:16px 0}svg{width:100%;height:auto;background:#fff;border:1px solid #dce4ed;border-radius:10px;touch-action:none}label{display:block;margin:12px 0;font-weight:600}input[type=range]{width:100%;accent-color:#2563eb}button{background:#245b91;color:white;border:0;border-radius:8px;padding:10px 16px;margin:4px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid orange}.out{background:#eaf3ff;padding:12px;border-radius:10px;white-space:pre-wrap}a{color:#245b91}header a{color:white}small{color:#566} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hint{color:#58677a}</style></head><body><header><div style="max-width:980px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>標本平均と信頼区間</h1>みんなの数学データベース｜図を動かして学ぶ</div></header><main><div class="panel"><h2>標本平均と95%信頼区間をシミュレーション</h2><p>母集団は平均50、標準偏差10の正規分布とします。毎回標本を抽出し、母標準偏差が既知の場合の95%信頼区間を作ります。</p><label>標本サイズ n：<output id="nv">25</output><input id="n" type="range" min="5" max="100" step="5" value="25"></label><svg id="s" viewBox="0 0 640 400" aria-label="標本ごとの信頼区間"></svg><button id="one">標本を1回抽出</button><button id="many">20回抽出</button><button id="reset">リセット</button><div class="out" id="o"></div><p class="hint">95%は「同じ方法で区間を何度も作ると、長期的に約95%が真の母平均を含む」という意味です。母平均自体は固定されています。</p></div></main><script>const s=document.getElementById('s'),n=document.getElementById('n'),nv=document.getElementById('nv'),o=document.getElementById('o');let rows=[],hits=0,total=0;function z(){let u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function sample(){let k=+n.value,sum=0;for(let i=0;i<k;i++)sum+=50+10*z();let mean=sum/k,err=1.96*10/Math.sqrt(k),ok=Math.abs(mean-50)<=err;total++;if(ok)hits++;rows.push({mean,err,ok});if(rows.length>18)rows.shift()}function draw(){nv.textContent=n.value;let lo=40,hi=60,X=x=>45+(x-lo)*27;let h='<rect width="640" height="400" fill="white"/>';for(let x=40;x<=60;x+=5)h+=`<line x1="${X(x)}" x2="${X(x)}" y1="30" y2="375" stroke="#e2e8f0"/><text x="${X(x)}" y="390" font-size="12" text-anchor="middle">${x}</text>`;h+=`<line x1="${X(50)}" x2="${X(50)}" y1="22" y2="375" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/><text x="${X(50)+6}" y="18" fill="#15803d" font-size="13">真の母平均 μ=50</text>`;rows.forEach((q,i)=>{let y=45+i*18,col=q.ok?'#2563eb':'#dc2626',a=X(q.mean-q.err),b=X(q.mean+q.err);h+=`<line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3"/><line x1="${a}" x2="${a}" y1="${y-4}" y2="${y+4}" stroke="${col}"/><line x1="${b}" x2="${b}" y1="${y-4}" y2="${y+4}" stroke="${col}"/><circle cx="${X(q.mean)}" cy="${y}" r="4" fill="${col}"/>`});s.innerHTML=h;o.textContent=`抽出回数：${total}\n母平均を含んだ区間：${hits}\n含有率：${total?((100*hits/total).toFixed(1)+'%'):'—'}\n青：母平均を含む　赤：含まない\n最新の18区間を表示`};document.getElementById('one').onclick=()=>{sample();draw()};document.getElementById('many').onclick=()=>{for(let i=0;i<20;i++)sample();draw()};document.getElementById('reset').onclick=()=>{rows=[];hits=total=0;draw()};n.oninput=()=>{rows=[];hits=total=0;draw()};draw();</script></body></html>
