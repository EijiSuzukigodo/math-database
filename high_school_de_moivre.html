<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ド・モアブルの定理と複素数の累乗 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:20px}main{max-width:950px;margin:24px auto;padding:0 16px 60px}a{color:#245b91}header a{color:white}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d;font-size:1.2rem}svg{width:100%;height:auto;max-height:480px;background:#fcfdff;border:1px solid #dae4ee;border-radius:10px;touch-action:none}input[type=range]{width:100%}label{display:block;margin:12px 0}button{padding:9px 15px;border:1px solid #9ab0c6;background:#eaf2fc;border-radius:9px;color:#17365d;font-weight:bold;cursor:pointer}button:focus-visible{outline:3px solid #397bce}.buttons{display:flex;flex-wrap:wrap;gap:8px}.math{background:#eef5ff;border-radius:9px;padding:12px;overflow-wrap:anywhere}small,.muted{color:#52657d}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dce5ef;padding:6px;text-align:center} .scroll{overflow:auto}</style></head><body><header><div style="max-width:950px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>ド・モアブルの定理と複素数の累乗</h1><div>数学C・複素数平面｜図を動かして理解する</div></div></header><main><section class="panel"><h2>複素数の累乗を回転で見る</h2><label>絶対値 r：<output id="rv"></output><input id="r" type="range" min="0.5" max="1.4" step="0.05" value="1"></label><label>偏角 θ：<output id="av"></output>°<input id="a" type="range" min="0" max="180" value="30"></label><label>指数 n：<output id="nv"></output><input id="n" type="range" min="1" max="8" value="3"></label><svg id="complex" viewBox="0 0 600 430" role="img" aria-label="複素数の累乗による回転と拡大縮小"></svg><p class="math" id="formula"></p><p>z = r(cos θ + i sin θ) なら、zⁿ = rⁿ(cos nθ + i sin nθ)。角度はn倍、長さはrのn乗になります。</p></section><section class="panel"><h2>1のn乗根</h2><p>zⁿ = 1 を満たす点は、単位円をn等分した位置に並びます。下のボタンで表示を切り替えます。</p><button id="roots">1のn乗根を表示する</button><p id="rootsnote"></p></section><p class="muted">この教材はブラウザだけで動作します。数式・図形は学習用に表示しています。</p></main><script>const ns='http://www.w3.org/2000/svg',svg=document.getElementById('complex'),cx=300,cy=215,sc=110;let show=false;function E(tag,attrs){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e}function draw(){svg.innerHTML='';E('line',{x1:30,y1:cy,x2:570,y2:cy,stroke:'#a5b6c7','stroke-width':2});E('line',{x1:cx,y1:20,x2:cx,y2:410,stroke:'#a5b6c7','stroke-width':2});E('circle',{cx,cy,r:sc,fill:'none',stroke:'#d5e2ef','stroke-width':2});let r=+document.getElementById('r').value,a=+document.getElementById('a').value,n=+document.getElementById('n').value;function vec(rad,deg,color){let x=rad*Math.cos(deg*Math.PI/180)*sc,y=-rad*Math.sin(deg*Math.PI/180)*sc;E('line',{x1:cx,y1:cy,x2:cx+x,y2:cy+y,stroke:color,'stroke-width':3});E('circle',{cx:cx+x,cy:cy+y,r:6,fill:color})}if(show){for(let k=0;k<n;k++){let deg=k*360/n;vec(1,deg,'#2875bd')}document.getElementById('rootsnote').textContent=n+' 個の解は、偏角 0°, '+(360/n).toFixed(1)+'°, … の等間隔の点です。'}else{vec(r,a,'#2875bd');vec(r**n,n*a,'#d05250');document.getElementById('rootsnote').textContent='青：z　赤：zⁿ'}document.getElementById('rv').textContent=r.toFixed(2);document.getElementById('av').textContent=a;document.getElementById('nv').textContent=n;document.getElementById('formula').textContent='zⁿ の絶対値 = '+(r**n).toFixed(3)+'、偏角 = '+(n*a)+'°（360°で一周）'}['r','a','n'].forEach(k=>document.getElementById(k).addEventListener('input',draw));document.getElementById('roots').addEventListener('click',()=>{show=!show;document.getElementById('roots').textContent=show?'累乗の表示に戻る':'1のn乗根を表示する';draw()});draw();</script></body></html>
