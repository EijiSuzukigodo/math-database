<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユークリッドの互除法を図で理解する | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#1c3048;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#17365d;color:white;padding:20px}main{max-width:900px;margin:auto;padding:18px}section{background:white;border:1px solid #dbe5ef;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d}label{display:block;font-weight:700;margin:12px 0 4px}input[type=range]{width:min(420px,75%);vertical-align:middle}input[type=number],select{font-size:17px;padding:8px;border:1px solid #aac0d6;border-radius:8px;max-width:120px}button{padding:10px 16px;border:0;border-radius:8px;background:#245b91;color:white;font-size:16px}canvas{width:100%;height:auto;border:1px solid #e0e7f0;border-radius:10px;background:#fff}output,.result{display:block;background:#eaf3ff;padding:12px;border-radius:10px;margin:12px 0;font-weight:600;white-space:pre-wrap}.muted{color:#536579}a{color:#fff}</style></head><body><header><a href="high_school.html">← 高校数学へ戻る</a><h1>ユークリッドの互除法を図で理解する</h1><div>みんなの数学データベース｜動かして理解する高校数学</div></header><main><section><h2>① 2つの整数を選ぼう</h2><p>長方形を正方形で切り分ける操作と、余りを求める計算を対応させます。</p><label>整数 a：<input id="a" type="number" min="1" max="999" value="84"></label><label>整数 b：<input id="b" type="number" min="1" max="999" value="36"></label><button id="run">計算する</button><div id="msg" class="result" aria-live="polite"></div></section><section><h2>② 長方形を正方形で埋める</h2><canvas id="cv" width="760" height="340"></canvas><p class="muted">最初の長方形を、短辺を一辺とする正方形で埋めます。残った部分に同じ操作を繰り返します。図は各段階を縮尺調整して表示します。</p></section><section><h2>③ 計算の手順</h2><div id="steps"></div><p>余りが0になったときの除数が最大公約数です。たとえば 84 と 36 の最大公約数は 12 です。</p></section></main><script>const $=id=>document.getElementById(id),c=$('cv'),ctx=c.getContext('2d');function draw(){let a=+$('a').value,b=+$('b').value;if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b<1||a>999||b>999){$('msg').textContent='1～999の整数を入力してください。';$('steps').textContent='';ctx.clearRect(0,0,760,340);return}let x=Math.max(a,b),y=Math.min(a,b),lines=[],rects=[],count=0;while(y&&count<20){let q=Math.floor(x/y),r=x%y;lines.push(`${x} = ${y} × ${q} + ${r}`);rects.push({x,y,q,r});x=y;y=r;count++}$('msg').textContent=`最大公約数：${x}　　計算回数：${count}回`;$('steps').textContent=lines.join('\n');ctx.clearRect(0,0,760,340);ctx.fillStyle='#1c3048';ctx.font='16px sans-serif';let show=rects.slice(0,4);show.forEach((o,i)=>{let col=i%2,row=Math.floor(i/2),ox=15+col*380,oy=15+row*165,maxw=340,maxh=120,scale=Math.min(maxw/o.x,maxh/o.y),w=o.x*scale,h=o.y*scale;ctx.strokeStyle='#245b91';ctx.strokeRect(ox,oy,w,h);for(let k=0;k<Math.min(o.q,150);k++){let xx=ox+k*o.y*scale;if(xx>w+ox)break;ctx.fillStyle=k%2?'#9ad3cf':'#aed4f4';ctx.fillRect(xx,oy,o.y*scale,h);ctx.strokeRect(xx,oy,o.y*scale,h)}if(o.r){ctx.fillStyle='#f5d6a5';ctx.fillRect(ox+o.q*o.y*scale,oy,o.r*scale,h)}ctx.fillStyle='#1c3048';ctx.fillText(`${o.x} ÷ ${o.y}：商${o.q}・余り${o.r}`,ox,oy+145)});if(rects.length>4)ctx.fillText('続きは下の計算手順を見てください。',380,325)}$('run').onclick=draw;$('a').onchange=draw;$('b').onchange=draw;draw();</script></body></html>
