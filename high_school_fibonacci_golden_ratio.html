<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フィボナッチ数列と黄金比 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#19324e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.7}header{background:#17365d;color:white;padding:20px}main{max-width:850px;margin:24px auto;padding:0 16px 60px}h1{font-size:clamp(23px,4vw,32px)}h2{font-size:21px}.panel{background:white;border:1px solid #d9e4f0;border-radius:16px;padding:20px;margin:16px 0}a{color:#27649b}header a{color:white}button,input{font:inherit}button{border:0;background:#215b91;color:white;border-radius:10px;padding:10px 16px;margin:4px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid orange}input[type=range]{width:100%;accent-color:#215b91}canvas{width:100%;height:auto;display:block;border:1px solid #dce6ef;border-radius:10px;background:#fff}.small{color:#53687b}.math{font-family:Georgia,serif;font-size:1.13em}.value{font-weight:bold;color:#124e85}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e4eaf1;padding:8px;text-align:left} .scroll{overflow:auto} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:5px}.cell{border-radius:7px;background:#e6f1ff;color:#17365d;text-align:center;padding:6px 2px;font-weight:bold}.cross{background:#e4e7eb;color:#8b94a1;text-decoration:line-through}.prime{background:#bdebd7;color:#0e5b3e} .step{background:#fff1bf;color:#694c00}</style></head><body><header><div style="max-width:850px;margin:auto"><a href="high_school.html">← 高校数学に戻る</a><h1>フィボナッチ数列と黄金比</h1></div></header><main><section class="panel"><h2>1. 数列を作ってみよう</h2><p>最初の2項を1, 1とし、前の2項を足して次の項を作ります。</p><p class="math">F₁=1, F₂=1, Fₙ₊₂=Fₙ₊₁+Fₙ</p><label for="n">表示する項数：<output id="nv">12</output></label><input id="n" type="range" min="3" max="30" value="12"><div class="scroll"><table><thead><tr><th>n</th><th>Fₙ</th><th>Fₙ₊₁/Fₙ</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>2. 黄金比への近づき方</h2><p>隣り合う項の比は黄金比 φ=(1+√5)/2 ≈ <span id="phi"></span> に近づきます。</p><canvas id="chart" width="760" height="370" aria-label="項の比と黄金比のグラフ"></canvas><p id="result" class="value" aria-live="polite"></p></section><section class="panel"><h2>考えてみよう</h2><p>なぜ比が黄金比に近づくのでしょうか。比の極限を x とおくと x=1+1/x、つまり x²−x−1=0 となります。正の解が黄金比です。</p><p class="small">※この説明は比が収束することを仮定して極限値を求めています。</p></section><script>const f=[0,1,1];for(let i=3;i<=31;i++)f[i]=f[i-1]+f[i-2];const phi=(1+Math.sqrt(5))/2;document.getElementById('phi').textContent=phi.toFixed(8);function draw(){let n=+document.getElementById('n').value;document.getElementById('nv').textContent=n;let rows='';for(let i=1;i<=n;i++)rows+=`<tr><td>${i}</td><td>${f[i]}</td><td>${(f[i+1]/f[i]).toFixed(7)}</td></tr>`;document.getElementById('rows').innerHTML=rows;let c=document.getElementById('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let L=55,R=725,T=25,B=315,y=v=>B-(v-1.0)/1.1*(B-T),x=i=>L+(i-1)/(n-1)*(R-L);ctx.strokeStyle='#aab8c6';ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.lineTo(R,B);ctx.stroke();ctx.font='16px sans-serif';ctx.fillStyle='#53687b';for(let v of [1,1.5,2])ctx.fillText(v.toFixed(1),15,y(v)+5);ctx.setLineDash([8,5]);ctx.strokeStyle='#d46b35';ctx.beginPath();ctx.moveTo(L,y(phi));ctx.lineTo(R,y(phi));ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#2169a2';ctx.lineWidth=3;ctx.beginPath();for(let i=1;i<=n;i++){let xx=x(i),yy=y(f[i+1]/f[i]);i===1?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy)}ctx.stroke();ctx.fillStyle='#2169a2';for(let i=1;i<=n;i++){ctx.beginPath();ctx.arc(x(i),y(f[i+1]/f[i]),3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#17365d';ctx.fillText('項番号 n →',R-105,350);document.getElementById('result').textContent=`第${n}項まで：F${n+1}/F${n} = ${(f[n+1]/f[n]).toFixed(8)} ／ 黄金比との差 ${Math.abs(f[n+1]/f[n]-phi).toExponential(2)}`};document.getElementById('n').addEventListener('input',draw);draw();</script></main></body></html>
