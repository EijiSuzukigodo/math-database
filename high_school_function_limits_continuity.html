<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>関数の極限と連続性を動かして理解する | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#1c3048;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#17365d;color:white;padding:20px}main{max-width:900px;margin:auto;padding:18px}section{background:white;border:1px solid #dbe5ef;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d}label{display:block;font-weight:700;margin:12px 0 4px}input[type=range]{width:min(420px,75%);vertical-align:middle}input[type=number],select{font-size:17px;padding:8px;border:1px solid #aac0d6;border-radius:8px;max-width:120px}button{padding:10px 16px;border:0;border-radius:8px;background:#245b91;color:white;font-size:16px}canvas{width:100%;height:auto;border:1px solid #e0e7f0;border-radius:10px;background:#fff}output,.result{display:block;background:#eaf3ff;padding:12px;border-radius:10px;margin:12px 0;font-weight:600;white-space:pre-wrap}.muted{color:#536579}a{color:#fff}</style></head><body><header><a href="high_school.html">← 高校数学へ戻る</a><h1>関数の極限と連続性を動かして理解する</h1><div>みんなの数学データベース｜動かして理解する高校数学</div></header><main><section><h2>① 関数を選ぶ</h2><label>関数の種類：<select id="type"><option value="continuous">連続：f(x)=x²</option><option value="hole">穴のある不連続：x=1で値が異なる</option><option value="jump">跳躍不連続：x=1で値が飛ぶ</option></select></label><label>近づく幅 h：<input id="h" type="range" min="1" max="200" value="100"> <span id="hv"></span></label><canvas id="cv" width="760" height="390"></canvas><div id="result" class="result" aria-live="polite"></div></section><section><h2>② 左右から近づける</h2><p>青い点は x=1−h、オレンジ色の点は x=1+h に対応します。スライダーを左に動かすと h が小さくなり、両側から x=1 に近づきます。</p><p>関数が x=1 で連続であるためには、左極限・右極限・f(1) の3つがすべて等しくなる必要があります。</p><p class="muted">グラフの白丸は、その点が関数の値として含まれないことを表します。</p></section></main><script>const $=id=>document.getElementById(id),c=$('cv'),g=c.getContext('2d');const X=x=>90+(x+2)*125,Y=y=>315-(y+1)*58;function f(t,x){if(t==='jump')return x<1?x*x:x*x+2;return x*x}function dot(x,y,color,open=false){g.beginPath();g.arc(X(x),Y(y),6,0,2*Math.PI);g.fillStyle=open?'white':color;g.fill();g.lineWidth=2;g.strokeStyle=color;g.stroke()}function update(){let t=$('type').value,h=+$('h').value/100,fl=f(t,1-h),fr=f(t,1+h),at=t==='hole'?3:t==='jump'?3:1;$('hv').textContent=h.toFixed(2);g.clearRect(0,0,760,390);g.strokeStyle='#e2eaf2';g.lineWidth=1;for(let x=-2;x<=3;x++){g.beginPath();g.moveTo(X(x),20);g.lineTo(X(x),365);g.stroke();g.fillStyle='#445';g.fillText(x,X(x)-4,378)}for(let y=-1;y<=5;y++){g.beginPath();g.moveTo(60,Y(y));g.lineTo(730,Y(y));g.stroke();g.fillText(y,35,Y(y)+4)}g.strokeStyle='#607b98';g.beginPath();g.moveTo(X(0),20);g.lineTo(X(0),365);g.moveTo(60,Y(0));g.lineTo(730,Y(0));g.stroke();function curve(a,b,shift,color){g.beginPath();for(let i=0;i<=400;i++){let x=a+(b-a)*i/400,y=x*x+shift;if(i===0)g.moveTo(X(x),Y(y));else g.lineTo(X(x),Y(y))}g.strokeStyle=color;g.lineWidth=3;g.stroke()}if(t==='jump'){curve(-2,1,0,'#2872b5');curve(1,3,2,'#2872b5');dot(1,1,'#2872b5',true);dot(1,3,'#2872b5')}else{curve(-2,3,0,'#2872b5');if(t==='hole'){dot(1,1,'#2872b5',true);dot(1,3,'#2872b5')}}g.setLineDash([5,5]);g.strokeStyle='#7b8da0';g.beginPath();g.moveTo(X(1),20);g.lineTo(X(1),365);g.stroke();g.setLineDash([]);dot(1-h,fl,'#1467bb');dot(1+h,fr,'#df812e');$('result').textContent=`左側 f(1−h) = ${fl.toFixed(4)}　右側 f(1+h) = ${fr.toFixed(4)}\nf(1) = ${at}\n${t==='continuous'?'左右の極限は1で一致し、f(1)=1なので連続です。':t==='hole'?'左右の極限は1で一致しますが、f(1)=3なので不連続です。':'左極限は1、右極限は3で一致しないため不連続です。'}`;}['type','h'].forEach(id=>$(id).oninput=update);update();</script></body></html>
