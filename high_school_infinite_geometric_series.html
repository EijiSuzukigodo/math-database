<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無限等比級数と面積 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#20334c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:18px}main{max-width:980px;margin:22px auto;padding:0 14px 50px}h1{font-size:1.5rem}h2{font-size:1.2rem;color:#17365d}.panel{background:white;border:1px solid #d8e3f1;border-radius:14px;padding:16px;margin:16px 0}svg{width:100%;height:auto;background:#fff;border:1px solid #dce4ed;border-radius:10px;touch-action:none}label{display:block;margin:12px 0;font-weight:600}input[type=range]{width:100%;accent-color:#2563eb}button{background:#245b91;color:white;border:0;border-radius:8px;padding:10px 16px;margin:4px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid orange}.out{background:#eaf3ff;padding:12px;border-radius:10px;white-space:pre-wrap}a{color:#245b91}header a{color:white}small{color:#566} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hint{color:#58677a}</style></head><body><header><div style="max-width:980px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>無限等比級数と面積</h1>みんなの数学データベース｜図を動かして学ぶ</div></header><main><div class="panel"><h2>無限に足しても、面積は有限になる？</h2><p>初項の面積を1として、比 r（0〜0.9）の長方形を順番に並べます。下の棒の長さが各項の面積に対応します。</p><div class="grid"><label>公比 r：<output id="rv">0.5</output><input id="r" type="range" min="0" max="0.9" step="0.05" value="0.5"></label><label>表示する項数 n：<output id="nv">6</output><input id="n" type="range" min="1" max="20" step="1" value="6"></label></div><svg id="s" viewBox="0 0 640 350" aria-label="等比級数の各項と部分和"></svg><div class="out" id="o"></div><p class="hint">0 ≤ r &lt; 1 の場合、無限等比級数の和は 1/(1−r)。負の公比の場合は面積の図ではなく符号つきの数列として考えます。</p></div></main><script>const r=document.getElementById('r'),n=document.getElementById('n'),s=document.getElementById('s'),o=document.getElementById('o'),rv=document.getElementById('rv'),nv=document.getElementById('nv');function draw(){let a=+r.value,k=+n.value,sum=0,h='<rect width="640" height="350" fill="white"/>';let scale=450*(1-a),x=50;for(let i=0;i<k;i++){let term=a**i,w=scale*term;sum+=term;if(w>.15)h+=`<rect x="${x}" y="100" width="${w}" height="100" fill="${i%2?'#60a5fa':'#93c5fd'}" stroke="#1d4ed8"/><text x="${x+Math.max(2,w/2)}" y="90" text-anchor="middle" font-size="${w<30?9:13}">${w>20?'r^'+i:''}</text>`;x+=w}h+=`<line x1="50" y1="215" x2="500" y2="215" stroke="#64748b"/><line x1="${50+450}" y1="60" x2="${50+450}" y2="235" stroke="#16a34a" stroke-dasharray="6 5" stroke-width="2"/><text x="50" y="260" font-size="16">部分和：${sum.toFixed(5)}</text><text x="50" y="287" font-size="16" fill="#15803d">無限和：${(1/(1-a)).toFixed(5)}</text><text x="50" y="320" font-size="13">※ 全体の幅を無限和に対応させて表示しています</text>`;s.innerHTML=h;rv.textContent=a.toFixed(2);nv.textContent=k;o.textContent=`S${k} = 1 + r + … + r^(${k-1}) = ${sum.toFixed(7)}\n無限和 S = 1/(1−r) = ${(1/(1-a)).toFixed(7)}\n残りの和 = ${(1/(1-a)-sum).toFixed(7)}`}r.oninput=draw;n.oninput=draw;draw();</script></body></html>
