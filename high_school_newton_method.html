<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニュートン法と方程式の近似解 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#20334c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:18px}main{max-width:980px;margin:22px auto;padding:0 14px 50px}h1{font-size:1.5rem}h2{font-size:1.2rem;color:#17365d}.panel{background:white;border:1px solid #d8e3f1;border-radius:14px;padding:16px;margin:16px 0}svg{width:100%;height:auto;background:#fff;border:1px solid #dce4ed;border-radius:10px;touch-action:none}label{display:block;margin:12px 0;font-weight:600}input[type=range]{width:100%;accent-color:#2563eb}button{background:#245b91;color:white;border:0;border-radius:8px;padding:10px 16px;margin:4px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid orange}.out{background:#eaf3ff;padding:12px;border-radius:10px;white-space:pre-wrap}a{color:#245b91}header a{color:white}small{color:#566} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hint{color:#58677a}</style></head><body><header><div style="max-width:980px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>ニュートン法と方程式の近似解</h1>みんなの数学データベース｜図を動かして学ぶ</div></header><main><div class="panel"><h2>接線を使って解に近づく</h2><p>例：f(x) = x³ − 2x − 2 = 0。初期値を変え、「1回進める」で接線とx軸の交点を確認します。</p><label>初期値 x₀：<output id="v">2.5</output><input id="x0" type="range" min="0.5" max="3" step="0.1" value="2.5"></label><svg id="s" viewBox="0 0 640 420" aria-label="ニュートン法のグラフ"></svg><button id="step">1回進める</button><button id="auto">5回進める</button><button id="reset">最初から</button><div class="out" id="o"></div><p class="hint">接線の傾きが0に近いと計算が不安定になります。ニュートン法は初期値によって収束しない場合もあります。</p></div></main><script>const x0=document.getElementById('x0'),v=document.getElementById('v'),s=document.getElementById('s'),o=document.getElementById('o');let hist=[];const f=x=>x*x*x-2*x-2,df=x=>3*x*x-2,X=x=>80+(x+.2)*145,Y=y=>345-y*36;function draw(){let h='<rect width="640" height="420" fill="white"/>';for(let i=-2;i<=7;i++)h+=`<line x1="0" x2="640" y1="${Y(i)}" y2="${Y(i)}" stroke="#eef2f7"/>`;h+=`<line x1="${X(0)}" x2="${X(0)}" y1="0" y2="420" stroke="#94a3b8"/><line x1="0" x2="640" y1="${Y(0)}" y2="${Y(0)}" stroke="#94a3b8"/>`;let d='';for(let x=-.2;x<=3.65;x+=.025)d+=(d?' L':'M')+X(x)+','+Y(f(x));h+=`<path d="${d}" fill="none" stroke="#2563eb" stroke-width="3"/>`;hist.forEach((x,i)=>{let y=f(x),m=df(x);if(Math.abs(m)<1e-8)return;let nx=x-y/m;h+=`<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(y)}" stroke="#64748b" stroke-dasharray="4 4"/><line x1="${X(x)}" y1="${Y(y)}" x2="${X(nx)}" y2="${Y(0)}" stroke="#dc2626" stroke-width="2"/><circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="#dc2626"/><text x="${X(x)+5}" y="${Y(0)+18}" font-size="12">x${i}</text>`});let x=hist.at(-1);h+=`<circle cx="${X(x)}" cy="${Y(f(x))}" r="7" fill="#16a34a"/>`;s.innerHTML=h;o.textContent=`現在 x${hist.length-1} = ${x.toFixed(8)}\nf(x) = ${f(x).toFixed(8)}\n反復回数：${hist.length-1}\n計算式：xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ)`}function reset(){hist=[+x0.value];v.textContent=x0.value;draw()}function step(){let x=hist.at(-1),m=df(x);if(Math.abs(m)<.00001){o.textContent='接線の傾きがほぼ0です。初期値を変えてください。';return}let nx=x-f(x)/m;if(!Number.isFinite(nx)||Math.abs(nx)>50){o.textContent='値が大きくなりすぎました。初期値を変えてください。';return}hist.push(nx);draw()}x0.oninput=reset;document.getElementById('reset').onclick=reset;document.getElementById('step').onclick=step;document.getElementById('auto').onclick=()=>{for(let i=0;i<5;i++)step()};reset();</script></body></html>
