<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスカルの三角形と二項定理 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:20px}main{max-width:950px;margin:24px auto;padding:0 16px 60px}a{color:#245b91}header a{color:white}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d;font-size:1.2rem}svg{width:100%;height:auto;max-height:480px;background:#fcfdff;border:1px solid #dae4ee;border-radius:10px;touch-action:none}input[type=range]{width:100%}label{display:block;margin:12px 0}button{padding:9px 15px;border:1px solid #9ab0c6;background:#eaf2fc;border-radius:9px;color:#17365d;font-weight:bold;cursor:pointer}button:focus-visible{outline:3px solid #397bce}.buttons{display:flex;flex-wrap:wrap;gap:8px}.math{background:#eef5ff;border-radius:9px;padding:12px;overflow-wrap:anywhere}small,.muted{color:#52657d}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dce5ef;padding:6px;text-align:center} .scroll{overflow:auto}</style></head><body><header><div style="max-width:950px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>パスカルの三角形と二項定理</h1><div>数学Ⅱ・式と証明｜図を動かして理解する</div></div></header><main><section class="panel"><h2>パスカルの三角形</h2><label>次数 n：<output id="nval">5</output><input id="n" type="range" min="0" max="10" value="5"></label><div class="scroll" id="triangle"></div><p class="math" id="formula"></p><p id="pascalnote"></p></section><section class="panel"><h2>なぜ隣の2つを足すの？</h2><p>二項係数は <strong>C(n,k) = C(n−1,k−1) + C(n−1,k)</strong> を満たします。三角形の隣り合う2数の和が、その下の数です。</p><p>例： (a+b)³ = a³ + 3a²b + 3ab² + b³</p></section><p class="muted">この教材はブラウザだけで動作します。数式・図形は学習用に表示しています。</p></main><script>const n=document.getElementById('n');const C=(n,k)=>{let v=1;for(let j=1;j<=k;j++)v=v*(n-j+1)/j;return Math.round(v)};function draw(){let m=+n.value;document.getElementById('nval').textContent=m;let t='<div style="min-width:320px">';for(let i=0;i<=m;i++){t+='<div style="display:flex;justify-content:center;gap:5px;margin:5px 0">';for(let k=0;k<=i;k++)t+='<span style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:4px;border-radius:7px;background:'+(i===m?'#cfe6ff':'#edf2f8')+'">'+C(i,k)+'</span>';t+='</div>'}t+='</div>';document.getElementById('triangle').innerHTML=t;let terms=[];for(let k=0;k<=m;k++){let c=C(m,k),a=m-k,b=k,s=(c===1?'':c.toString())+(a?('a'+(a===1?'':'^'+a)):'')+(b?('b'+(b===1?'':'^'+b)):'');terms.push(s||'1')}document.getElementById('formula').textContent='(a+b)^'+m+' = '+terms.join(' + ');document.getElementById('pascalnote').textContent='第 '+m+' 行の係数の合計は '+2**m+' (= 2^'+m+') です。'}n.addEventListener('input',draw);draw();</script></body></html>
