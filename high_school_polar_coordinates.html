<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極座標と極方程式 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b4d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:20px}main{max-width:950px;margin:24px auto;padding:0 16px 60px}a{color:#245b91}header a{color:white}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:16px 0}h1{font-size:1.6rem}h2{color:#17365d;font-size:1.2rem}svg{width:100%;height:auto;max-height:480px;background:#fcfdff;border:1px solid #dae4ee;border-radius:10px;touch-action:none}input[type=range]{width:100%}label{display:block;margin:12px 0}button{padding:9px 15px;border:1px solid #9ab0c6;background:#eaf2fc;border-radius:9px;color:#17365d;font-weight:bold;cursor:pointer}button:focus-visible{outline:3px solid #397bce}.buttons{display:flex;flex-wrap:wrap;gap:8px}.math{background:#eef5ff;border-radius:9px;padding:12px;overflow-wrap:anywhere}small,.muted{color:#52657d}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dce5ef;padding:6px;text-align:center} .scroll{overflow:auto}</style></head><body><header><div style="max-width:950px;margin:auto"><a href="high_school.html">← 高校数学の目次に戻る</a><h1>極座標と極方程式</h1><div>数学C・式と曲線｜図を動かして理解する</div></div></header><main><section class="panel"><h2>極座標 (r, θ)</h2><label>半径 r：<output id="rv"></output><input id="r" type="range" min="0" max="5" step="0.1" value="3"></label><label>角度 θ：<output id="av"></output>°<input id="a" type="range" min="0" max="360" value="45"></label><svg id="polar" viewBox="0 0 600 430" role="img" aria-label="極座標の点と極方程式の曲線"></svg><div class="math" id="xy"></div></section><section class="panel"><h2>極方程式の曲線</h2><label>曲線の種類<select id="kind" style="font-size:1rem;padding:8px"><option value="circle">円 r = 2</option><option value="cardioid">カージオイド r = 2(1+cos θ)</option><option value="rose">バラ曲線 r = 3 cos(3θ)</option><option value="spiral">アルキメデスの螺旋 r = θ/π</option></select></label><p>青い線が選択した極方程式の曲線です。赤い点は独立に指定した極座標 (r, θ) を表します。</p></section><p class="muted">この教材はブラウザだけで動作します。数式・図形は学習用に表示しています。</p></main><script>const ns='http://www.w3.org/2000/svg',svg=document.getElementById('polar'),cx=300,cy=215,scale=35;function E(tag,attrs){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e}function draw(){svg.innerHTML='';for(let i=-5;i<=5;i++){E('line',{x1:cx+i*scale,y1:20,x2:cx+i*scale,y2:410,stroke:'#e7edf5'});E('line',{x1:30,y1:cy+i*scale,x2:570,y2:cy+i*scale,stroke:'#e7edf5'})}E('line',{x1:30,y1:cy,x2:570,y2:cy,stroke:'#8ea5bc','stroke-width':2});E('line',{x1:cx,y1:20,x2:cx,y2:410,stroke:'#8ea5bc','stroke-width':2});let kind=document.getElementById('kind').value,path='';let steps=800,max=kind==='spiral'?4*Math.PI:2*Math.PI;for(let i=0;i<=steps;i++){let t=i/steps*max,r=kind==='circle'?2:kind==='cardioid'?2*(1+Math.cos(t)):kind==='rose'?3*Math.cos(3*t):t/Math.PI;let x=cx+scale*r*Math.cos(t),y=cy-scale*r*Math.sin(t);path+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)+' '}E('path',{d:path,fill:'none',stroke:'#2875bd','stroke-width':3});let r=+document.getElementById('r').value,a=+document.getElementById('a').value,x=r*Math.cos(a*Math.PI/180),y=r*Math.sin(a*Math.PI/180);E('line',{x1:cx,y1:cy,x2:cx+x*scale,y2:cy-y*scale,stroke:'#d05250','stroke-width':3});E('circle',{cx:cx+x*scale,cy:cy-y*scale,r:7,fill:'#d05250'});document.getElementById('rv').textContent=r.toFixed(1);document.getElementById('av').textContent=a;document.getElementById('xy').textContent='x = r cos θ = '+x.toFixed(2)+'、y = r sin θ = '+y.toFixed(2)}['r','a','kind'].forEach(k=>document.getElementById(k).addEventListener('input',draw));draw();</script></body></html>
