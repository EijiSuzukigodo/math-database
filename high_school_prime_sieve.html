<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素数とエラトステネスのふるい | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#19324e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.7}header{background:#17365d;color:white;padding:20px}main{max-width:850px;margin:24px auto;padding:0 16px 60px}h1{font-size:clamp(23px,4vw,32px)}h2{font-size:21px}.panel{background:white;border:1px solid #d9e4f0;border-radius:16px;padding:20px;margin:16px 0}a{color:#27649b}header a{color:white}button,input{font:inherit}button{border:0;background:#215b91;color:white;border-radius:10px;padding:10px 16px;margin:4px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid orange}input[type=range]{width:100%;accent-color:#215b91}canvas{width:100%;height:auto;display:block;border:1px solid #dce6ef;border-radius:10px;background:#fff}.small{color:#53687b}.math{font-family:Georgia,serif;font-size:1.13em}.value{font-weight:bold;color:#124e85}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e4eaf1;padding:8px;text-align:left} .scroll{overflow:auto} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:5px}.cell{border-radius:7px;background:#e6f1ff;color:#17365d;text-align:center;padding:6px 2px;font-weight:bold}.cross{background:#e4e7eb;color:#8b94a1;text-decoration:line-through}.prime{background:#bdebd7;color:#0e5b3e} .step{background:#fff1bf;color:#694c00}</style></head><body><header><div style="max-width:850px;margin:auto"><a href="high_school.html">← 高校数学に戻る</a><h1>素数とエラトステネスのふるい</h1></div></header><main><section class="panel"><h2>1. 素数を見つけよう</h2><p>2以上の整数のうち、1と自分自身以外に正の約数を持たない数が素数です。</p><label for="max">調べる上限：<output id="mv">100</output></label><input type="range" id="max" min="20" max="200" step="10" value="100"><p><button id="next">次の段階へ</button><button id="reset">最初から</button><button id="all">最後まで</button></p><p id="step" class="value" aria-live="polite"></p><div id="grid" class="grid" aria-label="素数のふるい"></div><p id="count"></p></section><section class="panel"><h2>2. ふるいの仕組み</h2><p>まず2の倍数（2自身を除く）を消し、次に3の倍数、5の倍数……と消していきます。√N以下の素数まで調べれば、残った2以上の数が素数です。</p><p>例えば100以下なら2、3、5、7の倍数を順に消します。</p><p class="small">緑：残った素数　灰色：消した合成数　黄色：今回調べる素数</p></section><script>let limit=100,stage=0;const max=document.getElementById('max');function primes(n){let a=[];for(let i=2;i*i<=n;i++){let ok=true;for(let j=2;j*j<=i;j++)if(i%j===0){ok=false;break}if(ok)a.push(i)}return a}function draw(){limit=+max.value;document.getElementById('mv').textContent=limit;let ps=primes(limit);stage=Math.min(stage,ps.length);let crossed=new Set;for(let s=0;s<stage;s++){let p=ps[s];for(let m=p*p;m<=limit;m+=p)crossed.add(m)}let str='';let count=0;for(let i=2;i<=limit;i++){let isprime=true;for(let d=2;d*d<=i;d++)if(i%d===0){isprime=false;break}if(isprime)count++;let cls=crossed.has(i)?'cross':stage===ps.length&&isprime?'prime':stage>0&&i===ps[stage-1]?'step':'';str+=`<div class="cell ${cls}" title="${i}">${i}</div>`}document.getElementById('grid').innerHTML=str;document.getElementById('step').textContent=stage===0?'開始前：2から順に調べます':stage===ps.length?'完了：すべての合成数を除きました':`${stage}段階目：${ps[stage-1]}の倍数を消しました`;document.getElementById('count').textContent=stage===ps.length?`${limit}以下の素数は${count}個です。`:'「次の段階へ」を押して変化を見てください。'}max.addEventListener('input',()=>{stage=0;draw()});document.getElementById('next').onclick=()=>{stage++;draw()};document.getElementById('reset').onclick=()=>{stage=0;draw()};document.getElementById('all').onclick=()=>{stage=primes(+max.value).length;draw()};draw();</script></main></body></html>
