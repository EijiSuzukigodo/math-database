<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基底と座標変換 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:#fff;padding:22px 16px}header a{color:white}.wrap{max-width:1020px;margin:auto;padding:0 16px}main{padding-top:24px;padding-bottom:48px}h1{font-size:clamp(23px,4vw,32px);margin:10px 0}h2{font-size:20px;color:#17365d}h3{margin:8px 0;color:#17365d}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #dfe6f0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 15px #17365d0b}svg{width:100%;height:auto;display:block;background:#fff;border:1px solid #e2e8f0;border-radius:10px}label{display:block;margin:12px 0;font-size:14px}input[type=range]{width:100%;accent-color:#2563eb;touch-action:pan-y}button{border:0;border-radius:9px;background:#225a91;color:white;padding:11px 13px;margin:4px;cursor:pointer;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #e8a526}output{font-variant-numeric:tabular-nums;font-weight:bold}.hint{background:#eaf3ff;border-radius:10px;padding:12px}.result{font-size:16px;white-space:pre-line}.small{font-size:13px;color:#526275}footer{padding:18px;background:#17365d;color:white}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{padding:13px}}</style></head><body><header><div class="wrap"><a href="linear_algebra.html">← 線形代数の目次へ戻る</a><h1>基底と座標変換</h1><div>同じベクトルを異なる基底で表すと、成分はどう変わる？</div></div></header><main class="wrap"><div class="layout"><div><section class="panel"><h2>図を動かして観察</h2><svg id="plot" viewBox="0 0 520 520" role="img" aria-label="座標平面上のベクトルと図形"></svg><p class="small">青・橙・緑の図形を見比べてください。数値は下の操作で変わります。</p></section><section class="panel"><h2>計算結果</h2><div class="result" id="result" aria-live="polite"></div></section></div><div><section class="panel"><h2>操作</h2><label>基底 b₁ の x 成分：<output id="aOut"></output><input id="a" type="range" min="-3" max="3" step="0.5" value="2"></label><label>基底 b₁ の y 成分：<output id="bOut"></output><input id="b" type="range" min="-3" max="3" step="0.5" value="0"></label><label>基底 b₂ の x 成分：<output id="cOut"></output><input id="c" type="range" min="-3" max="3" step="0.5" value="0"></label><label>基底 b₂ の y 成分：<output id="dOut"></output><input id="d" type="range" min="-3" max="3" step="0.5" value="2"></label><label>ベクトル v の x 成分：<output id="vxOut"></output><input id="vx" type="range" min="-4" max="4" step="0.5" value="3"></label><label>ベクトル v の y 成分：<output id="vyOut"></output><input id="vy" type="range" min="-4" max="4" step="0.5" value="2"></label><div><button onclick="preset(2,0,0,2,3,2)">拡大した基底</button><button onclick="preset(1,1,-1,1,3,2)">回転した基底</button><button onclick="preset(1,1,2,2,3,2)">一次従属な基底</button></div></section><section class="panel"><h2>考え方</h2><p>基底ベクトルを列に並べた行列を <b>B=[b₁ b₂]</b> とします。標準座標でのベクトル <b>v</b> と基底座標 <b>c</b> は <b>v=Bc</b> を満たします。</p><p><b>det(B)≠0</b> のとき <b>c=B⁻¹v</b> と一意に求まります。</p><p class="hint">ベクトルそのものは変わりません。表し方（座標成分）が変わります。基底が一次従属だと一意な座標表示はできません。</p></section></div></div></main><footer><div class="wrap">みんなの数学データベース</div></footer><script>const NS='http://www.w3.org/2000/svg';const svg=document.getElementById('plot');const W=520,C=260,S=36;function E(tag,attrs={},txt=''){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;return e}function xy(x,y){return [C+x*S,C-y*S]}function add(tag,attrs={},txt=''){let e=E(tag,attrs,txt);svg.appendChild(e);return e}function line(x1,y1,x2,y2,col='#94a3b8',width=2,dash=''){let a=xy(x1,y1),b=xy(x2,y2);return add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,'stroke-width':width,'stroke-dasharray':dash})}function point(x,y,col='#2563eb',r=5){let a=xy(x,y);add('circle',{cx:a[0],cy:a[1],r,fill:col})}function text(x,y,str,col='#334155'){let a=xy(x,y);add('text',{x:a[0]+7,y:a[1]-8,fill:col,'font-size':15,'font-weight':'600'},str)}function poly(pts,col,fill='none',width=3){add('polyline',{points:pts.map(p=>xy(...p).join(',')).join(' '),stroke:col,fill,'stroke-width':width,'stroke-linejoin':'round'})}function arrow(x,y,col,label){line(0,0,x,y,col,3.5);let a=xy(x,y),theta=Math.atan2(-y,x);for(let d of [-.48,.48]){let t=theta+Math.PI+d;add('line',{x1:a[0],y1:a[1],x2:a[0]+13*Math.cos(t),y2:a[1]+13*Math.sin(t),stroke:col,'stroke-width':3})}point(x,y,col,4);if(label)text(x,y,label,col)}function grid(){svg.innerHTML='';for(let n=-7;n<=7;n++){line(n,-7,n,7,'#e6edf5',1);line(-7,n,7,n,'#e6edf5',1)}line(-7,0,7,0,'#64748b',2);line(0,-7,0,7,'#64748b',2);text(6.5,-.3,'x');text(.15,6.5,'y')}function f(v){return Number(v).toFixed(2).replace(/\.00$/,'')}function set(id,v){document.getElementById(id).value=v}function val(id){return +document.getElementById(id).value}function bind(ids,fn){ids.forEach(id=>document.getElementById(id).addEventListener('input',fn));fn()}
function preset(...z){['a','b','c','d','vx','vy'].forEach((id,i)=>set(id,z[i]));draw()}function draw(){let a=val('a'),b=val('b'),c=val('c'),d=val('d'),x=val('vx'),y=val('vy'),det=a*d-b*c;grid();line(-7*a,-7*b,7*a,7*b,'#bfdbfe',2,'5 5');line(-7*c,-7*d,7*c,7*d,'#fed7aa',2,'5 5');arrow(a,b,'#2563eb','b₁');arrow(c,d,'#ea580c','b₂');arrow(x,y,'#16a34a','v');let msg=`基底行列 B = [[${f(a)}, ${f(c)}], [${f(b)}, ${f(d)}]]\n行列式 det(B) = ${f(det)}\n標準座標 v = (${f(x)}, ${f(y)})`;if(Math.abs(det)>1e-8){let q=(d*x-c*y)/det,r=(-b*x+a*y)/det;poly([[0,0],[q*a,q*b],[x,y],[r*c,r*d],[0,0]],'#a855f7','none',2);msg+=`\n基底座標 [v]ᵦ = (${f(q)}, ${f(r)})\n確認：${f(q)} b₁ + ${f(r)} b₂ = v`}else{msg+='\nこの2本は一次従属です。基底を作れず、座標は一意に定まりません。'}document.getElementById('result').textContent=msg;['a','b','c','d','vx','vy'].forEach(id=>document.getElementById(id+'Out').textContent=val(id))}bind(['a','b','c','d','vx','vy'],draw);</script></body></html>
