<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特異値分解（SVD） | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:#fff;padding:22px 16px}header a{color:white}.wrap{max-width:1020px;margin:auto;padding:0 16px}main{padding-top:24px;padding-bottom:48px}h1{font-size:clamp(23px,4vw,32px);margin:10px 0}h2{font-size:20px;color:#17365d}h3{margin:8px 0;color:#17365d}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #dfe6f0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 15px #17365d0b}svg{width:100%;height:auto;display:block;background:#fff;border:1px solid #e2e8f0;border-radius:10px}label{display:block;margin:12px 0;font-size:14px}input[type=range]{width:100%;accent-color:#2563eb;touch-action:pan-y}button{border:0;border-radius:9px;background:#225a91;color:white;padding:11px 13px;margin:4px;cursor:pointer;font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #e8a526}output{font-variant-numeric:tabular-nums;font-weight:bold}.hint{background:#eaf3ff;border-radius:10px;padding:12px}.result{font-size:16px;white-space:pre-line}.small{font-size:13px;color:#526275}footer{padding:18px;background:#17365d;color:white}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{padding:13px}}</style></head><body><header><div class="wrap"><a href="linear_algebra.html">← 線形代数の目次へ戻る</a><h1>特異値分解（SVD）</h1><div>単位円が回転・伸縮・回転によって楕円に変わる様子を観察</div></div></header><main class="wrap"><div class="layout"><div><section class="panel"><h2>図を動かして観察</h2><svg id="plot" viewBox="0 0 520 520" role="img" aria-label="座標平面上のベクトルと図形"></svg><p class="small">青・橙・緑の図形を見比べてください。数値は下の操作で変わります。</p></section><section class="panel"><h2>計算結果</h2><div class="result" id="result" aria-live="polite"></div></section></div><div><section class="panel"><h2>操作</h2><label>入力側の回転角（度）：<output id="thetaOut"></output><input id="theta" type="range" min="-180" max="180" step="5" value="30"></label><label>特異値 σ₁：<output id="s1Out"></output><input id="s1" type="range" min="0" max="3" step="0.1" value="2"></label><label>特異値 σ₂：<output id="s2Out"></output><input id="s2" type="range" min="0" max="3" step="0.1" value="1"></label><label>出力側の回転角（度）：<output id="phiOut"></output><input id="phi" type="range" min="-180" max="180" step="5" value="20"></label><div><button onclick="preset(30,2,1,20)">楕円</button><button onclick="preset(0,2,2,30)">円のまま拡大</button><button onclick="preset(30,2,0,20)">直線につぶれる</button></div></section><section class="panel"><h2>考え方</h2><p>行列は <b>A=UΣVᵀ</b> と分解できます。<b>Vᵀ</b> が入力側を回転し、<b>Σ</b> が直交する2方向を伸縮し、<b>U</b> が出力側を回転します。</p><p><b>σ₁, σ₂</b> は非負の特異値です。この教材では指定した2つの値を対角成分とする分解を表示します（大小の順序は自由です）。</p><p class="hint">青：元の単位円　橙：伸縮後　緑：最終的な楕円。特異値が0になると、円が線分または点につぶれます。</p></section></div></div></main><footer><div class="wrap">みんなの数学データベース</div></footer><script>const NS='http://www.w3.org/2000/svg';const svg=document.getElementById('plot');const W=520,C=260,S=36;function E(tag,attrs={},txt=''){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;return e}function xy(x,y){return [C+x*S,C-y*S]}function add(tag,attrs={},txt=''){let e=E(tag,attrs,txt);svg.appendChild(e);return e}function line(x1,y1,x2,y2,col='#94a3b8',width=2,dash=''){let a=xy(x1,y1),b=xy(x2,y2);return add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,'stroke-width':width,'stroke-dasharray':dash})}function point(x,y,col='#2563eb',r=5){let a=xy(x,y);add('circle',{cx:a[0],cy:a[1],r,fill:col})}function text(x,y,str,col='#334155'){let a=xy(x,y);add('text',{x:a[0]+7,y:a[1]-8,fill:col,'font-size':15,'font-weight':'600'},str)}function poly(pts,col,fill='none',width=3){add('polyline',{points:pts.map(p=>xy(...p).join(',')).join(' '),stroke:col,fill,'stroke-width':width,'stroke-linejoin':'round'})}function arrow(x,y,col,label){line(0,0,x,y,col,3.5);let a=xy(x,y),theta=Math.atan2(-y,x);for(let d of [-.48,.48]){let t=theta+Math.PI+d;add('line',{x1:a[0],y1:a[1],x2:a[0]+13*Math.cos(t),y2:a[1]+13*Math.sin(t),stroke:col,'stroke-width':3})}point(x,y,col,4);if(label)text(x,y,label,col)}function grid(){svg.innerHTML='';for(let n=-7;n<=7;n++){line(n,-7,n,7,'#e6edf5',1);line(-7,n,7,n,'#e6edf5',1)}line(-7,0,7,0,'#64748b',2);line(0,-7,0,7,'#64748b',2);text(6.5,-.3,'x');text(.15,6.5,'y')}function f(v){return Number(v).toFixed(2).replace(/\.00$/,'')}function set(id,v){document.getElementById(id).value=v}function val(id){return +document.getElementById(id).value}function bind(ids,fn){ids.forEach(id=>document.getElementById(id).addEventListener('input',fn));fn()}
function preset(a,b,c,d){set('theta',a);set('s1',b);set('s2',c);set('phi',d);draw()}function draw(){let t=val('theta')*Math.PI/180,s1=val('s1'),s2=val('s2'),p=val('phi')*Math.PI/180;grid();function R(a,v){return [Math.cos(a)*v[0]-Math.sin(a)*v[1],Math.sin(a)*v[0]+Math.cos(a)*v[1]]}let circ=[],mid=[],fin=[];for(let i=0;i<=180;i++){let q=2*Math.PI*i/180,z=[Math.cos(q),Math.sin(q)],w=R(-t,z),v=[s1*w[0],s2*w[1]];circ.push(z);mid.push(v);fin.push(R(p,v))}poly(circ,'#2563eb','none',2.5);poly(mid,'#ea580c','none',2.5);poly(fin,'#16a34a','none',3.5);let A1=R(p,[s1*Math.cos(t),s2*Math.sin(t)]),A2=R(p,[-s1*Math.sin(t),s2*Math.cos(t)]);arrow(...A1,'#16a34a','A e₁');arrow(...A2,'#059669','A e₂');let co=Math.cos(p),si=Math.sin(p),ct=Math.cos(t),st=Math.sin(t),a=co*s1*ct+si*s2*st,b=co*s1*st-si*s2*ct,c=si*s1*ct-co*s2*st,d=si*s1*st+co*s2*ct;document.getElementById('result').textContent=`A = U Σ Vᵀ\nA ≈ [[${f(a)}, ${f(b)}], [${f(c)}, ${f(d)}]]\nσ₁ = ${f(s1)}, σ₂ = ${f(s2)}\n行列式 det(A) = ${f(s1*s2)}\n単位円の面積 π → ${f(s1*s2)}π\n${Math.min(s1,s2)<1e-8?'特異値が0なので、変換はつぶれます。':'楕円の半軸の長さは特異値です。'}`;['theta','s1','s2','phi'].forEach(id=>document.getElementById(id+'Out').textContent=val(id))}bind(['theta','s1','s2','phi'],draw);</script></body></html>
