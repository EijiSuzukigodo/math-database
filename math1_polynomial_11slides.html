<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学Ⅰ 多項式の基礎｜みんなの数学データベース</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>body{margin:0;background:#edf3fb;color:#19324c;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.8}header{background:#153d70;color:white;padding:18px}header a{color:white}main{max-width:880px;margin:24px auto;padding:0 15px}.slide{background:white;border-radius:16px;padding:clamp(20px,5vw,45px);min-height:330px;box-shadow:0 4px 22px #163a671c}h1{font-size:1.3rem}h2{color:#18538d}.math{padding:20px;background:#edf6ff;border-left:5px solid #3a85cf;overflow:auto;font-size:1.2rem}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:20px 0}button{background:#165c9c;color:white;border:0;border-radius:9px;padding:13px 17px;font-size:1rem}button:disabled{background:#a7b5c4}details{margin-top:20px;padding:12px;background:#fff8e6;border-radius:8px}summary{cursor:pointer}#count{padding:10px}footer{text-align:center;color:#52677a;padding:15px}</style></head>
<body><header><h1>みんなの数学データベース｜数学Ⅰ「多項式の基礎」</h1><a href="math_subject_1.html">数学Ⅰの目次へ</a></header>
<main><p>全11枚の教科書形式スライドです。音声は付いていません。</p><section class="slide" id="slide"></section>
<div class="controls"><button id="prev">◀ 前へ</button><strong id="count"></strong><button id="next">次へ ▶</button><button id="auto">▶ 自動送り</button><button id="stop">■ 停止</button></div>
<p>自動送りは18秒ごとです。解説は「解答・ポイントを見る」を押すと表示されます。</p></main><footer>みんなの数学データベース</footer>
<script>
const slides=[["多項式とは", "数や文字の積でできた式を「項」といいます。項を足し合わせた式が多項式です。", "3x^2-2x+5", "項は 3x²、−2x、5 です。"], ["単項式と多項式", "1つの項だけの式を単項式、いくつかの項の和からなる式を多項式といいます。", "4x^2y \\qquad x^2+3x-1", "左が単項式、右が多項式です。"], ["係数と次数", "係数は数の部分、単項式の次数は文字の指数の和です。", "-5x^2y", "係数は −5、次数は 2+1=3 です。"], ["同類項", "文字の部分が同じ項を同類項といい、まとめることができます。", "3x^2+5x-2x^2+1=x^2+5x+1", "x² の項だけをまとめます。"], ["多項式の次数", "0でない項のうち、最も高い次数が多項式の次数です。", "2x^3-x^2+4", "この式は3次式です。"], ["降べきの順", "文字の次数が高い順に並べます。", "3-2x^2+5x=-2x^2+5x+3", "次数の低い順は昇べきの順です。"], ["多項式の加法", "かっこを外して同類項をまとめます。", "(2x^2+3x-1)+(x^2-5x+4)=3x^2-2x+3", "係数を正しく足しましょう。"], ["多項式の減法", "引く式の各項の符号を変えてから計算します。", "(3x^2+x-2)-(x^2-4x+1)=2x^2+5x-3", "マイナスのかっこに注意しましょう。"], ["分配法則", "単項式を、多項式の各項に掛けます。", "2x(3x^2-x+4)=6x^3-2x^2+8x", "指数法則も使います。"], ["多項式の乗法", "一方の各項を、もう一方のすべての項に掛けます。", "(x+2)(x+3)=x^2+5x+6", "展開してから同類項をまとめます。"], ["確認問題", "次の式を展開してみましょう。", "(2x-3)(x+4)", "答え：2x²+5x−12"]];
let i=0,timer=null;
function draw(){let s=slides[i];document.getElementById('slide').innerHTML='<h2>'+(i+1)+'. '+s[0]+'</h2><p>'+s[1]+'</p><div class="math">\\('+s[2]+'\\)</div><details><summary>解答・ポイントを見る</summary><p>'+s[3]+'</p></details>';document.getElementById('count').textContent=(i+1)+' / '+slides.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([document.getElementById('slide')]);}
function stop(){clearInterval(timer);timer=null;document.getElementById('auto').textContent='▶ 自動送り'}
document.getElementById('prev').onclick=()=>{stop();if(i>0){i--;draw()}};
document.getElementById('next').onclick=()=>{stop();if(i<slides.length-1){i++;draw()}};
document.getElementById('stop').onclick=stop;
document.getElementById('auto').onclick=()=>{if(timer){stop();return}document.getElementById('auto').textContent='Ⅱ 一時停止';timer=setInterval(()=>{if(i<slides.length-1){i++;draw()}else stop()},18000)};
draw();
</script></body></html>
