<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学Ⅰ｜多項式の基礎・音声調整版</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eaf0f7;color:#19324d;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}h1{font-size:clamp(18px,3vw,27px);margin:0}.tag{background:#dceaff;color:#16558e;border-radius:20px;padding:8px 12px;font-weight:bold;font-size:12px}.stage{position:relative;background:linear-gradient(140deg,#0e2b4c,#174d77);border-radius:22px;color:white;aspect-ratio:16/9;min-height:290px;box-shadow:0 15px 35px #1238;overflow:hidden;display:flex;flex-direction:column;padding:clamp(20px,4vw,46px)}.stage:after{content:'みんなの数学データベース';position:absolute;bottom:15px;right:22px;opacity:.35;font-size:12px}.kicker{font-size:clamp(13px,2vw,19px);color:#9fe5fa;font-weight:bold}.title{font-size:clamp(23px,4vw,43px);font-weight:800;margin:12px 0}.formula{background:#ffffff14;border:1px solid #ffffff40;border-radius:16px;padding:clamp(12px,2vw,25px);text-align:center;font-size:clamp(27px,5vw,62px);font-family:Georgia,'Times New Roman',serif;letter-spacing:.02em;margin:10px 0}.formula sup{font-size:.58em}.explain{font-size:clamp(15px,2.3vw,24px);line-height:1.65;max-width:920px}.highlight{color:#ffe07b}.note{margin-top:auto;font-size:clamp(12px,1.6vw,17px);color:#cbe2f6}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}button{background:#1164a5;color:white;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:bold;cursor:pointer}button.secondary{background:white;color:#15517e;border:1px solid #bed0e0}button:disabled{opacity:.45}select{font-size:15px;border:1px solid #bdd0df;border-radius:9px;padding:10px;background:white}.progress{height:8px;background:#cbd9e6;border-radius:9px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#1774b8;width:0;transition:width .3s}.info{background:white;border-radius:14px;padding:17px;line-height:1.8}.info p{margin:6px 0}.small{font-size:13px;color:#546779}.badge{background:#fceab2;color:#775200;padding:3px 8px;border-radius:6px;font-size:14px} @media(max-width:560px){.wrap{padding:10px}.stage{min-height:330px;aspect-ratio:auto;padding:22px}.controls button{flex:1}header{align-items:flex-start}}
</style></head><body><div class="wrap"><header><h1>数学Ⅰ｜第1回 多項式の基礎</h1><span class="tag">自動スライド授業</span></header><main><section class="stage" aria-live="polite"><div class="kicker" id="kicker"></div><div class="title" id="title"></div><div class="formula" id="formula"></div><div class="explain" id="explain"></div><div class="note" id="note"></div></section><div class="progress"><div class="bar" id="bar"></div></div><div class="controls"><button id="play">▶ 授業を始める</button><button id="prev" class="secondary">◀ 前へ</button><button id="next" class="secondary">次へ ▶</button><button id="restart" class="secondary">最初から</button><label for="voice">声を選択</label><select id="voice"><option value="">自動選択</option></select><button id="refresh" class="secondary">声の一覧を更新</button><label for="speed">読み上げ速度</label><select id="speed"><option value="0.82">ゆっくり</option><option value="0.92" selected>標準</option><option value="1">自然な速さ</option></select></div><div class="info"><p><strong id="count"></strong>　<span id="status" class="badge">停止中</span></p><p id="script"></p><p class="small" id="voiceInfo">Safariで利用できる日本語音声を表示します。iPad設定の「声1」とは一致しない場合があります。声の品質は端末に依存します。</p><p class="small">「授業を始める」で説明を読み上げ、終了後に自動で次のスライドに進みます。音が出ない場合は音量を確認してください。</p></div></main></div><script>
const slides=[
{k:'導入',t:'多項式の基礎',f:'3x<sup>2</sup> + 2x − 5',e:'今日の目標は、単項式・多項式・次数・同類項を理解することです。',n:'第1回｜数と式',s:'みなさん、こんにちは。今日は数学一、多項式の基礎を学びます。単項式、多項式、次数、同類項を順番に確認しましょう。'},
{k:'1｜単項式',t:'単項式とは？',f:'5x<sup>2</sup>y',e:'数や文字を掛け合わせてできた式を<span class="highlight">単項式</span>といいます。',n:'例：3x、−2ab、7 も単項式です。',s:'まず、単項式です。数や文字を掛け合わせてできた式を単項式といいます。例えば、五エックス二乗ワイ、三エックス、マイナス二エービー、七などです。'},
{k:'2｜多項式',t:'多項式とは？',f:'3x<sup>2</sup> + 2x − 5',e:'単項式を足し合わせた式を<span class="highlight">多項式</span>といいます。',n:'引き算は、負の単項式を足すことと考えます。',s:'次に、多項式です。単項式を足し合わせた式を多項式といいます。三エックス二乗、プラス二エックス、マイナス五は、多項式です。'},
{k:'3｜項',t:'多項式を項に分ける',f:'<span class="highlight">3x<sup>2</sup></span>　+　<span class="highlight">2x</span>　−　<span class="highlight">5</span>',e:'この式の項は <span class="highlight">3x²、2x、−5</span> の3つです。符号も含めて考えます。',n:'「−5」も1つの項です。',s:'多項式を作る一つ一つの単項式を、項といいます。この式には、三エックス二乗、二エックス、マイナス五、という三つの項があります。マイナスの符号も忘れないでください。'},
{k:'4｜係数',t:'係数を確認しよう',f:'<span class="highlight">3</span>x<sup>2</sup> + <span class="highlight">2</span>x − 5',e:'文字を含む項で、文字に掛かっている数が<span class="highlight">係数</span>です。',n:'3x² の係数は3、2x の係数は2。',s:'係数とは、文字に掛かっている数のことです。三エックス二乗の係数は三、二エックスの係数は二です。'},
{k:'5｜次数',t:'単項式の次数',f:'4x<sup>2</sup>y<sup>3</sup> → <span class="highlight">5次</span>',e:'文字の指数を足します。<span class="highlight">2 + 3 = 5</span> なので5次です。',n:'数だけの単項式（0以外）の次数は0です。',s:'単項式の次数は、文字の指数の和です。四エックス二乗ワイ三乗なら、二足す三で、五次です。'},
{k:'6｜多項式の次数',t:'最も高い次数を調べる',f:'3x<sup>2</sup> + 2x − 5 → <span class="highlight">2次</span>',e:'各項の次数のうち、最も大きいものが多項式の次数です。',n:'項の次数：2、1、0。したがって2次式。',s:'多項式の次数は、各項の次数のうち最も高いものです。三エックス二乗、プラス二エックス、マイナス五は、二次式です。'},
{k:'7｜同類項',t:'同類項をまとめる',f:'3x + 5x − 2x = <span class="highlight">6x</span>',e:'文字の部分が同じ項を<span class="highlight">同類項</span>といいます。係数だけを計算します。',n:'3 + 5 − 2 = 6',s:'同類項とは、文字の部分が同じ項のことです。三エックス、プラス五エックス、マイナス二エックスは、係数をまとめて、六エックスになります。'},
{k:'8｜練習問題',t:'自分で考えてみよう',f:'2x<sup>2</sup> + 3x + 5x<sup>2</sup> − x',e:'同類項をまとめると、どんな式になるでしょうか。',n:'一時停止して考えてみましょう。',s:'ここで練習問題です。二エックス二乗、プラス三エックス、プラス五エックス二乗、マイナスエックス。同類項をまとめてみましょう。少し考える時間を取ります。'},
{k:'9｜解答',t:'練習問題の答え',f:'<span class="highlight">7x<sup>2</sup> + 2x</span>',e:'2x² + 5x² = 7x²、3x − x = 2x です。',n:'次数の異なる項どうしはまとめられません。',s:'答えは、七エックス二乗、プラス二エックスです。二エックス二乗と五エックス二乗をまとめて七エックス二乗。三エックスとマイナスエックスをまとめて二エックスです。'},
{k:'まとめ',t:'今日のポイント',f:'単項式 → 多項式 → 次数 → 同類項',e:'項の符号を正しく見て、同じ文字の部分を持つ項をまとめましょう。',n:'お疲れさまでした。',s:'今日のまとめです。単項式、多項式、次数、同類項を確認しました。項の符号に注意して計算しましょう。お疲れさまでした。'}
];
let index=0,playing=false,token=0,timer=null,voices=[];
const $=id=>document.getElementById(id);
function loadVoices(){
 if(!('speechSynthesis' in window)){$('voiceInfo').textContent='このブラウザは音声読み上げに対応していません。';return;}
 const old=$('voice').value;
 voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ja'));
 $('voice').innerHTML='<option value="">自動選択</option>';
 voices.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=v.name+'（'+v.lang+'）';$('voice').appendChild(o)});
 if(old!=='' && Number(old)<voices.length)$('voice').value=old;
 $('voiceInfo').textContent='Safariで使える日本語音声：'+voices.length+'件。声を選んで授業を始めてください。iPad設定の「声1」が表示されない場合は、HTMLから直接選択できません。';
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}
$('refresh').onclick=loadVoices;
function render(){const a=slides[index];for(const k of ['kicker','title','formula','explain','note'])$(k).innerHTML=a[{kicker:'k',title:'t',formula:'f',explain:'e',note:'n'}[k]];
 $('count').textContent=`${index+1} / ${slides.length} 枚目`;$('script').textContent='読み上げ原稿：'+a.s;
 $('bar').style.width=((index+1)/slides.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;
 $('play').textContent=playing?'■ 停止':'▶ 授業を始める';$('status').textContent=playing?'再生中':'停止中';}
function stop(){playing=false;token++;clearTimeout(timer);if('speechSynthesis' in window)speechSynthesis.cancel();render()}
function advance(t){if(t!==token||!playing)return;if(index<slides.length-1){index++;render();speak(t)}else stop()}
function speak(t){if(!playing||t!==token)return;clearTimeout(timer);
 if(!('speechSynthesis' in window)){timer=setTimeout(()=>advance(t),Math.max(6000,slides[index].s.length*160));return;}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(slides[index].s);u.lang='ja-JP';u.rate=Number($('speed').value);u.pitch=1;
 const chosen=$('voice').value;
 if(chosen!==''&&voices[Number(chosen)])u.voice=voices[Number(chosen)];else if(voices.length){u.voice=voices.find(v=>/premium|enhanced|siri/i.test(v.name))||voices[0]}
 let done=false;
 u.onend=()=>{if(done||t!==token)return;done=true;timer=setTimeout(()=>advance(t),index===8?4000:1700)};
 u.onerror=()=>{if(done||t!==token)return;done=true;$('status').textContent='音声を確認してください';};
 try{speechSynthesis.speak(u)}catch(e){$('status').textContent='音声を再生できません'}
}
function start(){playing=true;token++;render();speak(token)}
$('play').onclick=()=>playing?stop():start();
$('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()};
$('next').onclick=()=>{stop();index=Math.min(slides.length-1,index+1);render()};
$('restart').onclick=()=>{stop();index=0;render()};
$('speed').onchange=()=>{if(playing){token++;speak(token)}};
$('voice').onchange=()=>{if(playing){token++;speak(token)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop()});render();
</script></body></html>
