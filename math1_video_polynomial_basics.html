<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ビデオ授業｜多項式の基礎｜みんなの数学データベース</title><style>
:root{--navy:#17365d;--blue:#176cae;--line:#d8e5f2}*{box-sizing:border-box}body{margin:0;background:#f2f7fc;color:#18314c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.7}.wrap{max-width:950px;margin:auto;padding:0 16px}header{background:linear-gradient(110deg,#17365d,#215f99);color:white;padding:22px 0}header a{color:white}h1{font-size:clamp(23px,4vw,32px);margin:12px 0 2px}header p{margin:0;color:#e3effc}main{padding:24px 0 48px}.player{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #17365d15}.stage{background:linear-gradient(145deg,#f8fcff,#e8f3ff);min-height:370px;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.step{font-size:14px;color:#47718d;font-weight:700}.stage h2{font-size:clamp(24px,4vw,34px);margin:12px 0;color:var(--navy)}.formula{font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,6vw,49px);font-weight:700;color:#13558d;margin:16px 0;letter-spacing:.02em}.visual{min-height:86px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px}.tile{display:inline-grid;place-items:center;border:2px solid #4b91c8;border-radius:12px;min-width:68px;padding:12px;background:#fff;color:#164d7e;font-size:24px;font-weight:700}.tile.minus{border-color:#d18b55;color:#a04b16;background:#fff7ee}.explain{font-size:clamp(16px,2.5vw,20px);max-width:700px;margin:14px auto 0}.controls{padding:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center}button{font:inherit;cursor:pointer;border:1px solid #bed3e5;background:white;color:var(--navy);border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:focus-visible,a:focus-visible{outline:3px solid #f2ad32;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.progress{height:8px;background:#dce9f4}.bar{height:100%;width:0;background:#176cae;transition:width .2s}.options{padding:0 18px 18px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:14px}.options label{display:flex;gap:7px;align-items:center}.note{background:#e7f2ff;border-left:4px solid #176cae;padding:14px;border-radius:8px;margin:20px 0}.quiz{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}.quiz h2{margin-top:0;font-size:21px}.quiz button{margin:5px}.feedback{font-weight:700;min-height:28px}.links{margin-top:22px;display:flex;gap:18px;flex-wrap:wrap}a{color:#176cae}@media(max-width:550px){.stage{min-height:380px;padding:20px 14px}.controls{gap:8px}.controls button{padding:9px 12px}.tile{min-width:54px;font-size:20px}}
</style></head><body><header><div class="wrap"><a href="math_subject_1.html">← 数学Ⅰの授業一覧へ戻る</a><h1>🎬 ビデオ授業：多項式の基礎</h1><p>数学Ⅰ｜第1章 数と式｜第1回</p></div></header><main class="wrap"><div class="note">「再生」を押すと、図と説明が順番に進みます。音声は端末の読み上げ機能を使用します。iPadの消音設定やSafariの仕様により、音声が出ない場合もあります。</div><section class="player" aria-label="授業プレーヤー"><div class="stage" aria-live="polite"><div class="step" id="step">1 / 7</div><h2 id="heading">多項式とは？</h2><div class="formula" id="formula">3x² + 2x − 5</div><div class="visual" id="visual"></div><p class="explain" id="explain">文字と数を使った式のしくみを学びましょう。</p></div><div class="progress"><div class="bar" id="bar"></div></div><div class="controls"><button id="prev">◀ 前へ</button><button class="primary" id="play">▶ 再生</button><button id="next">次へ ▶</button><button id="restart">↺ 最初から</button></div><div class="options"><label><input type="checkbox" id="voice" checked> 音声読み上げ</label><label>進む速さ <select id="speed"><option value="9000">ゆっくり</option><option value="6500" selected>標準</option><option value="4200">速い</option></select></label></div></section><section class="quiz"><h2>確認問題</h2><p>式 <strong>4x² − 3x + 7</strong> の次数はいくつでしょうか？</p><div><button data-answer="1">1次</button><button data-answer="2">2次</button><button data-answer="3">3次</button></div><p class="feedback" id="feedback" aria-live="polite"></p></section><div class="links"><a href="math1_polynomial_basics.html">📖 教科書形式の授業を読む →</a><a href="math_subject_1.html">数学Ⅰの授業一覧へ →</a></div></main><script>
const steps=[
{h:'多項式とは？',f:'3x² + 2x − 5',v:['3x²','+ 2x','− 5'],t:'多項式は、いくつかの項を足したり引いたりしてできた式です。'},
{h:'項を見つけよう',f:'3x² + 2x − 5',v:['3x²','+ 2x','− 5'],t:'この式の項は、3エックスの二乗、2エックス、マイナス5の3つです。符号も含めて考えます。'},
{h:'係数と定数項',f:'3x² + 2x − 5',v:['係数 3','係数 2','定数項 −5'],t:'文字を含む項で、文字にかかっている数を係数といいます。文字を含まない項は定数項です。'},
{h:'次数を調べよう',f:'3x² + 2x − 5',v:['2次','1次','0次'],t:'各項の次数は文字の指数で決まります。この多項式の次数は、最も高い2です。'},
{h:'同類項とは？',f:'2x + 3x − 4',v:['2x','+ 3x','− 4'],t:'文字の部分が同じ項を同類項といいます。2エックスと3エックスは同類項です。'},
{h:'同類項をまとめる',f:'2x + 3x − 4 = 5x − 4',v:['2x + 3x','＝ 5x'],t:'同類項は係数を足し引きしてまとめられます。2エックスと3エックスを足すと5エックスです。'},
{h:'まとめ',f:'3x² + 2x − 5',v:['項','係数','次数'],t:'多項式では、項、係数、次数、同類項の4つを区別できるようにしましょう。確認問題に挑戦してください。'}
];
let index=0,playing=false,timer=null;const $=id=>document.getElementById(id);
function stopVoice(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speak(){stopVoice();if(!$('voice').checked||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(steps[index].t);u.lang='ja-JP';u.rate=.92;window.speechSynthesis.speak(u)}
function render(){let s=steps[index];$('step').textContent=(index+1)+' / '+steps.length;$('heading').textContent=s.h;$('formula').textContent=s.f;$('explain').textContent=s.t;$('visual').replaceChildren(...s.v.map((x)=>{let e=document.createElement('span');e.className='tile'+(x.trim().startsWith('−')?' minus':'');e.textContent=x;return e}));$('bar').style.width=((index+1)/steps.length*100)+'%';$('prev').disabled=index===0;$('next').disabled=index===steps.length-1}
function pause(){playing=false;clearTimeout(timer);timer=null;stopVoice();$('play').textContent='▶ 再生'}
function schedule(){clearTimeout(timer);if(!playing)return;timer=setTimeout(()=>{if(index===steps.length-1){pause();return}index++;render();speak();schedule()},Number($('speed').value))}
function move(n){index=Math.max(0,Math.min(steps.length-1,n));render();if(playing){speak();schedule()}else stopVoice()}
$('play').onclick=()=>{if(playing){pause();return}if(index===steps.length-1)index=0;playing=true;$('play').textContent='⏸ 一時停止';render();speak();schedule()};$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);$('restart').onclick=()=>{pause();move(0)};$('speed').onchange=()=>{if(playing)schedule()};$('voice').onchange=()=>{if(!$('voice').checked)stopVoice();else if(playing)speak()};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{$('feedback').textContent=b.dataset.answer==='2'?'正解です！ 最高次数は x² の2です。':'もう一度考えましょう。最も大きい文字の指数に注目します。'});render();
</script></body></html>
