<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学教材 日本語音声テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#edf3f9;color:#17334e;margin:0;padding:18px}main{max-width:700px;margin:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 5px 20px #17334e18}h1{font-size:24px}select,button{font-size:17px;padding:12px;border-radius:9px;max-width:100%}select{width:100%;border:1px solid #a7bdcf}button{border:0;background:#1265a2;color:white;margin:8px 5px 8px 0}button.secondary{background:#5d7182}p{line-height:1.8}.note{font-size:14px;color:#546779}.result{padding:12px;background:#eaf2fa;border-radius:9px;overflow-wrap:anywhere}label{font-weight:bold;display:block;margin-top:18px}</style></head><body><main><h1>日本語音声テスト</h1><p>iPadのSafariが利用できる日本語音声を調べます。元の数学教材は変更しません。</p><label for="voice">① 音声を選択</label><select id="voice"><option>音声を確認しています…</option></select><p id="detail" class="note"></p><button id="refresh" class="secondary">音声一覧を更新</button><label>② 試聴</label><button id="play">▶ この声で試聴</button><button id="stop" class="secondary">■ 停止</button><p class="result">読み上げ文：こんにちは。数学Ⅰ、多項式の基礎を学びましょう。今日は、単項式と多項式について説明します。</p><p id="status" class="result" aria-live="polite">準備中</p><p class="note">「声1（男性）」が一覧にない場合、Safariから直接指定できない可能性があります。声の名前だけでは男女を確定できません。必ず試聴して確認してください。</p></main><script>
const sel=document.getElementById('voice'),detail=document.getElementById('detail'),status=document.getElementById('status');let voices=[];function refresh(){if(!('speechSynthesis'in window)){status.textContent='このブラウザでは音声合成を利用できません';sel.innerHTML='<option>利用できません</option>';return;}const old=sel.value;voices=speechSynthesis.getVoices().filter(v=>/^ja(?:-|_)/i.test(v.lang)||v.lang.toLowerCase()==='ja');sel.innerHTML='';if(!voices.length){sel.add(new Option('日本語音声がまだ取得できません',''));status.textContent='一覧が空です。「音声一覧を更新」を押してください。';detail.textContent='';return;}voices.forEach((v,i)=>sel.add(new Option(v.name+'（'+v.lang+'）',String(i))));if([...sel.options].some(o=>o.value===old))sel.value=old;else{let idx=voices.findIndex(v=>/声1|otoya|male|男性/i.test(v.name));sel.value=String(idx>=0?idx:0);}updateDetail();status.textContent='日本語音声 '+voices.length+' 件を取得しました。';}function updateDetail(){const v=voices[Number(sel.value)];detail.textContent=v?'選択中：'+v.name+' ／ 言語：'+v.lang+' ／ '+(v.localService?'端末内の音声':'外部音声の可能性'):'音声が見つかりません';}sel.addEventListener('change',updateDetail);document.getElementById('refresh').onclick=refresh;document.getElementById('play').onclick=()=>{if(!voices.length){status.textContent='音声を選べません。更新してください。';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('こんにちは。数学いち、多項式の基礎を学びましょう。今日は、単項式と多項式について説明します。');u.lang='ja-JP';u.rate=.92;u.voice=voices[Number(sel.value)];u.onstart=()=>status.textContent='再生中：'+u.voice.name;u.onend=()=>status.textContent='再生が終了しました';u.onerror=e=>status.textContent='再生できませんでした：'+e.error;speechSynthesis.speak(u);};document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();status.textContent='停止しました';};if('speechSynthesis'in window){speechSynthesis.addEventListener('voiceschanged',refresh);refresh();setTimeout(refresh,700);}else refresh();
</script></body></html>
