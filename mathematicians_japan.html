<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>日本の有名な数学者｜みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#253347;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.8}header{background:#17365d;color:white;padding:30px 20px}header div,main,footer div{max-width:1000px;margin:auto}h1{margin:0;font-size:clamp(23px,4vw,34px)}header p{margin:8px 0 0}main{padding:28px 18px 60px}h2{color:#17365d}a{color:#176cae}a:focus-visible{outline:3px solid orange}.back{display:inline-block;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #d8e3ef;border-radius:15px;padding:20px}.card h2{margin:0;font-size:22px}.card p{margin:8px 0;color:#526173}.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;background:#eaf2fb;color:#17365d;font-size:13px}footer{padding:22px;background:#17365d;color:white}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div><h1>日本の有名な数学者</h1><p>和算を中心に、日本の数学の歴史を紹介します。</p></div></header><main><a class="back" href="index.html">← トップページへ戻る</a><div class="grid"><article class="card"><h2>関孝和</h2><p>江戸時代の和算家。方程式の研究などで知られます。</p><span class="tag">準備中</span></article><article class="card"><h2>建部賢弘</h2><p>江戸時代の和算家。円周率などの研究で知られます。</p><span class="tag">準備中</span></article><article class="card"><h2>吉田光由</h2><p>『塵劫記』を著し、和算の普及に貢献しました。</p><span class="tag">準備中</span></article><article class="card"><h2>高木貞治</h2><p>近代日本の数学の発展を支えた数学者です。</p><span class="tag">準備中</span></article></div></main><footer><div>みんなの数学データベース</div></footer></body></html>
