<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>海外の有名な数学者｜みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#253347;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.8}header{background:#17365d;color:white;padding:30px 20px}header div,main,footer div{max-width:1000px;margin:auto}h1{margin:0;font-size:clamp(23px,4vw,34px)}header p{margin:8px 0 0}main{padding:28px 18px 60px}h2{color:#17365d}a{color:#176cae}a:focus-visible{outline:3px solid orange}.back{display:inline-block;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid #d8e3ef;border-radius:15px;padding:20px}.card h2{margin:0;font-size:22px}.card p{margin:8px 0;color:#526173}.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;background:#eaf2fb;color:#17365d;font-size:13px}footer{padding:22px;background:#17365d;color:white}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div><h1>海外の有名な数学者</h1><p>高校数学の教科書に関連する数学者を紹介します。</p></div></header><main><a class="back" href="index.html">← トップページへ戻る</a><div class="grid"><article class="card"><h2><a href="pythagoras.html">ピタゴラス →</a></h2><p>三平方の定理との関係で知られる古代ギリシャの数学者。</p><span class="tag">教材公開中</span></article><article class="card"><h2>ユークリッド</h2><p>幾何学を体系化した『原論』で知られます。</p><span class="tag">準備中</span></article><article class="card"><h2>デカルト</h2><p>座標を用いる解析幾何学の発展に大きく貢献しました。</p><span class="tag">準備中</span></article><article class="card"><h2>ニュートン</h2><p>微積分学の発展に貢献しました。</p><span class="tag">準備中</span></article><article class="card"><h2>パスカル</h2><p>確率論やパスカルの三角形で知られます。</p><span class="tag">準備中</span></article><article class="card"><h2>ガウス</h2><p>数論・統計・幾何学など幅広い分野で活躍しました。</p><span class="tag">準備中</span></article></div></main><footer><div>みんなの数学データベース</div></footer></body></html>
