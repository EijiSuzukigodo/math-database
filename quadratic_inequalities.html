<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2次不等式をグラフで理解する | みんなの数学データベース</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f4f7fb;color:#17243b;margin:0}header{background:#163c70;color:white;padding:20px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #163c7012}h1{font-size:1.5rem;margin:0}h2{font-size:1.15rem}label{display:block;margin:12px 0}input[type=range]{width:75%;vertical-align:middle}select{font-size:1rem;padding:8px;width:100%;max-width:340px}canvas{width:100%;height:auto;border:1px solid #dde5ee;border-radius:8px}output{font-weight:bold;display:inline-block;min-width:3em}#answer{font-size:1.18rem;line-height:1.8}a{color:#1759a8}.note{font-size:.92rem;color:#42546d}button{padding:9px 12px;border:1px solid #aac2de;background:#f0f6ff;border-radius:8px;margin:3px}</style></head><body><header><h1>2次不等式をグラフで理解する</h1><div>みんなの数学データベース ｜ 数学Ⅰ</div></header><main><p><a href="high_school.html">← 高校数学の目次に戻る</a></p><section class="panel"><h2>① 係数を動かしてみよう</h2><p>関数 <strong>y = ax² + bx + c</strong> のグラフを描きます。</p><label>a：<input id="a" type="range" min="-4" max="4" step="1" value="1"><output id="av"></output></label><label>b：<input id="b" type="range" min="-8" max="8" step="1" value="0"><output id="bv"></output></label><label>c：<input id="c" type="range" min="-8" max="8" step="1" value="-4"><output id="cv"></output></label><p class="note">a = 0 のときは1次式になります。2次不等式を調べる場合は a ≠ 0 にしてください。</p><h2>② 不等号を選ぼう</h2><select id="op"><option value=">">ax² + bx + c &gt; 0</option><option value=">=">ax² + bx + c ≥ 0</option><option value="<">ax² + bx + c &lt; 0</option><option value="<=">ax² + bx + c ≤ 0</option></select><div><button data-preset="two">交点が2つ</button><button data-preset="touch">x軸に接する</button><button data-preset="none">交点なし</button></div></section><section class="panel"><h2>③ グラフで確かめよう</h2><canvas id="graph" width="800" height="500" role="img" aria-label="2次関数のグラフ。青い太線が不等式を満たすxの範囲を表します"></canvas><p class="note">青い太線は、不等式を満たすxの範囲です。端点の白丸は含まない、青い丸は含むことを示します。緑の放物線は y = ax² + bx + c です。</p></section><section class="panel"><h2>④ 解を確認しよう</h2><div id="formula"></div><div id="disc"></div><div id="answer" aria-live="polite"></div><p class="note">グラフの表示範囲は x = −8 ～ 8 です。解は表示範囲の外まで続く場合があります。</p></section></main><script>
const $=id=>document.getElementById(id),cv=$('graph'),ctx=cv.getContext('2d');
const fmt=n=>{if(Math.abs(n)<1e-9)return '0';let z=Math.round(n*1000)/1000;return String(z).replace('-', '−')};
function intervals(a,b,c,op){const inclusive=op.includes('='),positive=op[0]==='>';const valid=v=>positive?v>0:v<0;const roots=[];if(a===0){if(b!==0)roots.push(-c/b)}else{const d=b*b-4*a*c;if(d>1e-10){roots.push((-b-Math.sqrt(d))/(2*a),(-b+Math.sqrt(d))/(2*a))}else if(Math.abs(d)<=1e-10){roots.push(-b/(2*a))}}roots.sort((x,y)=>x-y);let edges=[-Infinity,...roots,Infinity],out=[];for(let i=0;i<edges.length-1;i++){let lo=edges[i],hi=edges[i+1],test=Number.isFinite(lo)&&Number.isFinite(hi)?(lo+hi)/2:Number.isFinite(lo)?lo+1:Number.isFinite(hi)?hi-1:0;if(valid(a*test*test+b*test+c))out.push({lo,hi,li:inclusive&&Number.isFinite(lo),ri:inclusive&&Number.isFinite(hi)})}if(inclusive){for(let r of roots){if(!out.some(q=>(q.lo===r&&q.li)||(q.hi===r&&q.ri)))out.push({lo:r,hi:r,li:true,ri:true})}}return {out,roots};}
function formatAnswer(out){if(!out.length)return '解なし';let parts=out.map(q=>{let l=q.lo,h=q.hi;if(l===-Infinity&&h===Infinity)return 'すべての実数';if(l===h)return 'x = '+fmt(l);if(l===-Infinity)return 'x '+(q.ri?'≤':'<')+' '+fmt(h);if(h===Infinity)return 'x '+(q.li?'≥':'>')+' '+fmt(l);return fmt(l)+' '+(q.li?'≤':'<')+' x '+(q.ri?'≤':'<')+' '+fmt(h)});return parts.join(' または ')}
function draw(){let a=+$('a').value,b=+$('b').value,c=+$('c').value,op=$('op').value;['a','b','c'].forEach(id=>$(id+'v').textContent=$(id).value);let {out,roots}=intervals(a,b,c,op),W=cv.width,H=cv.height,ox=W/2,oy=H/2,sx=W/16,sy=H/20;ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e8edf5';ctx.lineWidth=1;for(let x=-8;x<=8;x++){let X=ox+x*sx;ctx.beginPath();ctx.moveTo(X,0);ctx.lineTo(X,H);ctx.stroke()}for(let y=-10;y<=10;y+=2){let Y=oy-y*sy;ctx.beginPath();ctx.moveTo(0,Y);ctx.lineTo(W,Y);ctx.stroke()}ctx.strokeStyle='#67768d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();ctx.font='17px sans-serif';ctx.fillStyle='#35445a';for(let x=-8;x<=8;x+=2){if(x!==0)ctx.fillText(x,ox+x*sx-10,oy+23)}ctx.fillText('x',W-18,oy-10);ctx.fillText('y',ox+10,18);ctx.strokeStyle='#12845f';ctx.lineWidth=4;ctx.beginPath();for(let p=0;p<=W;p++){let x=(p-ox)/sx,y=a*x*x+b*x+c,Y=oy-y*sy;if(p===0)ctx.moveTo(p,Y);else ctx.lineTo(p,Y)}ctx.stroke();ctx.strokeStyle='#2369dc';ctx.lineWidth=9;for(let q of out){let l=Math.max(-8,q.lo),h=Math.min(8,q.hi);if(l<h){ctx.beginPath();ctx.moveTo(ox+l*sx,oy);ctx.lineTo(ox+h*sx,oy);ctx.stroke()}}for(let r of roots){if(r<-8||r>8)continue;let included=out.some(q=>(q.lo===r&&q.li)||(q.hi===r&&q.ri));ctx.beginPath();ctx.arc(ox+r*sx,oy,7,0,2*Math.PI);ctx.fillStyle=included?'#2369dc':'white';ctx.fill();ctx.strokeStyle='#2369dc';ctx.lineWidth=3;ctx.stroke()}$('formula').textContent='不等式：'+fmt(a)+'x² '+(b<0?'− ':'+ ')+fmt(Math.abs(b))+'x '+(c<0?'− ':'+ ')+fmt(Math.abs(c))+' '+op.replace('>=','≥').replace('<=','≤')+' 0';$('disc').textContent=a!==0?'判別式 D = b² − 4ac = '+fmt(b*b-4*a*c):'a = 0 なので1次不等式です';$('answer').textContent='解：'+formatAnswer(out)}
['a','b','c','op'].forEach(id=>$(id).addEventListener('input',draw));document.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>{let k=btn.dataset.preset;$('a').value=1;$('b').value=0;$('c').value=k==='two'?-4:k==='touch'?0:4;draw()}));draw();
</script></body></html>
