<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漸化式 自動判定・解法 | みんなの数学データベース</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;background:#f4f7fb;color:#1c2d42;margin:0;line-height:1.8}header{background:#17365d;color:white;padding:22px 16px}main{max-width:850px;margin:auto;padding:18px}section{background:white;padding:18px;border-radius:14px;margin:16px 0;border:1px solid #d9e3ee}h1{margin:0;font-size:1.55rem}h2{color:#17365d;font-size:1.2rem}input,select,button{font:inherit;max-width:100%;box-sizing:border-box}input,select{padding:9px;border:1px solid #a8b9cb;border-radius:8px}input[type=text]{width:100%}button{border:0;background:#17639b;color:white;padding:10px 17px;border-radius:9px;cursor:pointer;margin:6px 4px 6px 0}button.secondary{background:#e5edf5;color:#17365d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#526579}.step{border-left:4px solid #4389b7;background:#f5faff;padding:9px 12px;margin:10px 0;border-radius:5px}.math{font-family:Georgia,'Times New Roman',serif;font-size:1.13em;overflow-wrap:anywhere}.error{color:#a22222}code{white-space:normal}footer{padding:20px;text-align:center;color:#526579}</style></head><body><header><div style="max-width:850px;margin:auto"><h1>漸化式の自動判定と解法</h1><div>みんなの数学データベース｜数学B・試作版</div></div></header><main><section><h2>① 漸化式を入力</h2><p class="muted">半角で入力してください。対応する形：<code>a_{n+1}=3a_n+2</code>、<code>a_{n+2}=3a_{n+1}-2a_n</code>。初項は a₁ です。</p><label for="formula">漸化式</label><input id="formula" type="text" value="a_{n+1}=3a_n+2" autocomplete="off" spellcheck="false"><div class="grid"><label>初項 a₁<input id="a1" type="number" value="1" step="any" style="width:100%"></label><label>第2項 a₂（3項間の場合）<input id="a2" type="number" value="3" step="any" style="width:100%"></label></div><div><button onclick="solve()">種類を判定して解く</button><button class="secondary" onclick="example(1)">一次型の例</button><button class="secondary" onclick="example(2)">隣接3項間の例</button><button class="secondary" onclick="example(3)">重解の例</button></div></section><section id="output" aria-live="polite"><h2>② 判定と解法</h2><p>「種類を判定して解く」を押してください。</p></section><section><h2>対応範囲について</h2><p>この試作版は、定数係数の一次漸化式と、定数係数の同次隣接3項間漸化式を扱います。分数型・階差型・連立型・nを含む係数などは、今後の拡張対象です。入力したすべての漸化式を自動で解けるわけではありません。</p></section></main><footer>みんなの数学データベース</footer><script>
const el=id=>document.getElementById(id); const fmt=x=>Number.isInteger(x)?String(x):String(Number(x.toPrecision(9)));const near=(x,y)=>Math.abs(x-y)<1e-9;const sgn=x=>x<0?' − '+fmt(-x):' + '+fmt(x);const num=s=>s===''||s==='+'?1:s==='-'?-1:Number(s);
function example(i){if(i===1){el('formula').value='a_{n+1}=3a_n+2';el('a1').value=1}else if(i===2){el('formula').value='a_{n+2}=3a_{n+1}-2a_n';el('a1').value=1;el('a2').value=3}else{el('formula').value='a_{n+2}=4a_{n+1}-4a_n';el('a1').value=1;el('a2').value=4}solve()}
function parse(){let f=el('formula').value.replace(/\s/g,'').replace(/−/g,'-').replace(/＋/g,'+').replace(/\*/g,'').replace(/a_\{n\+1\}/g,'U').replace(/a_\{n\+2\}/g,'V').replace(/a_\{n\}/g,'A').replace(/a_\{1\}/g,'a1').replace(/a_\{2\}/g,'a2').replace(/a_\{n\}/g,'A').replace(/a_n/g,'A').replace(/aₙ/g,'A').replace(/a_\{n\+1\}/g,'U').replace(/a_\{n\+2\}/g,'V');let m=f.match(/^(U|V)=(.+)$/);if(!m)throw Error('左辺は a_{n+1} または a_{n+2} とし、右辺を入力してください。');let rhs=m[2];if(!/^[0-9.+\-AUV]+$/.test(rhs))throw Error('対応していない文字や記号があります。');let terms=rhs.replace(/-/g,'+-').split('+').filter(Boolean);let c={A:0,U:0,V:0,k:0};for(let t of terms){let mm=t.match(/^(-?(?:\d+(?:\.\d*)?|\.\d+)?)?([AUV])$/);if(mm){let v=num(mm[1]||'');if(!Number.isFinite(v))throw Error('係数が不正です。');c[mm[2]]+=v}else if(/^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))c.k+=Number(t);else throw Error('右辺の式を読み取れません。例：3a_n+2');}return {order:m[1],c}}
function solve(){let out=el('output');try{let {order,c}=parse(),a=Number(el('a1').value),b=Number(el('a2').value);if(el('a1').value===''||!Number.isFinite(a))throw Error('初項 a₁ を入力してください。');let steps=[],type='',general='',term='';const add=(h,t)=>steps.push('<div class="step"><strong>'+h+'</strong><div class="math">'+t+'</div></div>');if(order==='U'){if(c.U!==0||c.V!==0)throw Error('右辺には a_n と定数のみ入力できます。');let p=c.A,q=c.k;type=near(q,0)?'等比型':near(p,1)?'等差型':'一次非同次型';add('1. 型を判定','aₙ₊₁ = '+fmt(p)+'aₙ'+sgn(q));if(near(p,1)){add('2. 階差を考える','aₙ₊₁ − aₙ = '+fmt(q));add('3. 初項から加える','aₙ = a₁ + (n−1)×'+fmt(q));general='aₙ = '+fmt(a)+sgn(q)+'(n−1)';term=n=>a+(n-1)*q}else if(near(p,0)){add('2. 次項は一定','n ≥ 2 では aₙ = '+fmt(q));general='a₁ = '+fmt(a)+'、n ≥ 2 で aₙ = '+fmt(q);term=n=>n===1?a:q}else{let fixed=q/(1-p),C=a-fixed;add('2. 定数解（不動点）を求める','α = '+fmt(p)+'α'+sgn(q)+' より α = '+fmt(fixed));add('3. α を引く','aₙ₊₁ − ('+fmt(fixed)+') = '+fmt(p)+'{aₙ − ('+fmt(fixed)+')}');add('4. 等比数列に帰着','bₙ = aₙ − ('+fmt(fixed)+') とおくと、bₙ = '+fmt(C)+' × ('+fmt(p)+')ⁿ⁻¹');general='aₙ = '+fmt(fixed)+' + ('+fmt(C)+') × ('+fmt(p)+')ⁿ⁻¹';term=n=>fixed+C*Math.pow(p,n-1)}}else{if(c.V!==0||!near(c.k,0))throw Error('隣接3項間は a_{n+2}=p a_{n+1}+q a_n の同次型に対応しています。');if(el('a2').value===''||!Number.isFinite(b))throw Error('第2項 a₂ を入力してください。');let p=c.U,q=c.A,D=p*p+4*q;type='隣接3項間（定数係数・同次）';add('1. 特性方程式を立てる','r² − ('+fmt(p)+')r − ('+fmt(q)+') = 0');if(D<0){let re=p/2,im=Math.sqrt(-D)/2,rad=Math.sqrt(-q),theta=Math.atan2(im,re),A=a,B=(b/rad-a*Math.cos(theta))/Math.sin(theta);add('2. 複素共役な特性根','r = '+fmt(re)+' ± '+fmt(im)+'i');add('3. 実数の一般項','aₙ = '+fmt(rad)+'ⁿ⁻¹ {A cos((n−1)θ) + B sin((n−1)θ)}、θ = '+fmt(theta)+'（ラジアン）');general='aₙ = '+fmt(rad)+'ⁿ⁻¹ ['+fmt(A)+' cos((n−1)×'+fmt(theta)+')'+sgn(B)+' sin((n−1)×'+fmt(theta)+')]';term=n=>Math.pow(rad,n-1)*(A*Math.cos((n-1)*theta)+B*Math.sin((n-1)*theta));type+='・複素共役根'}else if(near(D,0)){let r=p/2;if(near(r,0)){add('2. 特性根は0（重解）','aₙ₊₂ = 0 より n ≥ 3 で aₙ = 0');general='a₁ = '+fmt(a)+'、a₂ = '+fmt(b)+'、n ≥ 3 で aₙ = 0';term=n=>n===1?a:n===2?b:0}else{let B=b/r-a;add('2. 重解を求める','r = '+fmt(r)+'（重解）');add('3. 一般形と初期条件','aₙ = (A+B(n−1))rⁿ⁻¹、A = '+fmt(a)+'、B = '+fmt(B));general='aₙ = ('+fmt(a)+sgn(B)+'(n−1)) × ('+fmt(r)+')ⁿ⁻¹';term=n=>(a+B*(n-1))*Math.pow(r,n-1)}type+='・重解'}else{let r1=(p+Math.sqrt(D))/2,r2=(p-Math.sqrt(D))/2,A=(b-a*r2)/(r1-r2),B=a-A;add('2. 異なる特性根','r₁ = '+fmt(r1)+'、r₂ = '+fmt(r2));add('3. 一般形','aₙ = A r₁ⁿ⁻¹ + B r₂ⁿ⁻¹');add('4. 初期条件から定数を求める','A+B = '+fmt(a)+'、'+fmt(r1)+'A'+sgn(r2)+'B = '+fmt(b)+' より A = '+fmt(A)+'、B = '+fmt(B));general='aₙ = '+fmt(A)+' × ('+fmt(r1)+')ⁿ⁻¹'+sgn(B)+' × ('+fmt(r2)+')ⁿ⁻¹';term=n=>A*Math.pow(r1,n-1)+B*Math.pow(r2,n-1);type+='・異なる実数根'}}let rows=Array.from({length:7},(_,i)=>'<tr><td style="padding:4px 12px">'+(i+1)+'</td><td style="padding:4px 12px">'+fmt(term(i+1))+'</td></tr>').join('');out.innerHTML='<h2>② 判定と解法</h2><p><strong>判定結果：</strong>'+type+'</p>'+steps.join('')+'<h2>③ 一般項</h2><div class="step math"><strong>'+general+'</strong></div><h2>④ 最初の7項を確認</h2><table><thead><tr><th>n</th><th>aₙ</th></tr></thead><tbody>'+rows+'</tbody></table><p class="muted">数値は必要に応じて小数近似で表示します。式の表示は数値係数を用いた形式です。</p>'}catch(e){out.innerHTML='<h2>② 判定と解法</h2><p class="error">'+e.message+'</p><p>例のボタンを押すと、対応する漸化式を試せます。</p>'}}solve();
</script></body></html>
