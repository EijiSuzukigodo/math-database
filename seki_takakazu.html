<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>関孝和｜みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#253347;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.8}header{background:#17365d;color:#fff;padding:30px 18px}header div,main,footer div{max-width:920px;margin:auto}h1{margin:0;font-size:clamp(24px,4vw,36px)}header p{margin:5px 0}main{padding:26px 18px 55px}h2{color:#17365d;margin-top:0}section{background:#fff;border:1px solid #d8e3ef;border-radius:16px;padding:22px;margin:18px 0}a{color:#176cae}a:focus-visible,input:focus-visible{outline:3px solid #ed9d24;outline-offset:3px}input{font-size:17px;width:100%;max-width:280px;padding:10px;border:1px solid #abc3da;border-radius:8px}button{font-size:16px;background:#176cae;color:white;border:0;padding:11px 18px;border-radius:9px;cursor:pointer}.formula{font-size:24px;font-weight:bold;color:#17365d;background:#edf4fc;border-radius:12px;padding:18px;text-align:center}.result{background:#e9f7f1;border-radius:10px;padding:14px;margin-top:12px;min-height:48px}footer{background:#17365d;color:white;padding:18px}.back{display:inline-block;margin-bottom:8px}small{color:#667085}svg{max-width:100%;height:auto}</style></head><body><header><div><h1>関孝和</h1><p>日本の数学者と数学を学ぶ</p></div></header><main><a class="back" href="mathematicians_japan.html">← 日本の数学者一覧へ戻る</a><section><h2>人物紹介</h2><p>江戸時代の和算家。方程式の扱いを発展させ、行列式に通じる研究でも知られます。</p><small>※歴史上の研究と、以下の学習用の題材は必ずしも同一ではありません。</small></section><section><h2>数学のテーマ：方程式と数の規則</h2><div class="formula">x²−5x＋6＝0</div><p>(x−2)(x−3)＝0 より x＝2, 3</p></section><section><h2>動く教材：方程式の解を探す</h2><p>x²−5x＋6 の値を計算し、0になる点を確かめましょう。</p><label for="v">x の値</label><input id="v" type="range" min="-1" max="6" value="2" step="0.1" oninput="calc()"><div id="out" class="result" aria-live="polite"></div><script>function calc(){let x=+document.getElementById('v').value;document.getElementById('out').textContent=`x = ${x.toFixed(1)}、x²−5x＋6 = ${(x*x-5*x+6).toFixed(2)}`;}calc()</script></section><section><h2>確認問題</h2><p>x²−5x＋6＝0 を解いてみましょう。</p><details><summary>解答・解説を表示</summary><p>x＝2, 3。 (x−2)(x−3)＝0 と因数分解します。</p></details></section></main><footer><div>みんなの数学データベース</div></footer></body></html>
