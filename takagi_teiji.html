<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高木貞治｜みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#253347;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.8}header{background:#17365d;color:#fff;padding:30px 18px}header div,main,footer div{max-width:920px;margin:auto}h1{margin:0;font-size:clamp(24px,4vw,36px)}header p{margin:5px 0}main{padding:26px 18px 55px}h2{color:#17365d;margin-top:0}section{background:#fff;border:1px solid #d8e3ef;border-radius:16px;padding:22px;margin:18px 0}a{color:#176cae}a:focus-visible,input:focus-visible{outline:3px solid #ed9d24;outline-offset:3px}input{font-size:17px;width:100%;max-width:280px;padding:10px;border:1px solid #abc3da;border-radius:8px}button{font-size:16px;background:#176cae;color:white;border:0;padding:11px 18px;border-radius:9px;cursor:pointer}.formula{font-size:24px;font-weight:bold;color:#17365d;background:#edf4fc;border-radius:12px;padding:18px;text-align:center}.result{background:#e9f7f1;border-radius:10px;padding:14px;margin-top:12px;min-height:48px}footer{background:#17365d;color:white;padding:18px}.back{display:inline-block;margin-bottom:8px}small{color:#667085}svg{max-width:100%;height:auto}</style></head><body><header><div><h1>高木貞治</h1><p>日本の数学者と数学を学ぶ</p></div></header><main><a class="back" href="mathematicians_japan.html">← 日本の数学者一覧へ戻る</a><section><h2>人物紹介</h2><p>近代日本の数学者。代数的整数論の研究で国際的に知られ、数学教育にも大きく貢献しました。</p><small>※歴史上の研究と、以下の学習用の題材は必ずしも同一ではありません。</small></section><section><h2>数学のテーマ：素数と整数の性質</h2><div class="formula">84＝2²×3×7</div><p>素因数分解では、整数を素数の積で表します。</p></section><section><h2>動く教材：素因数分解</h2><p>整数を入力して素因数分解を試しましょう。</p><label for="v">2〜100000 の整数</label><input id="v" type="number" min="2" max="100000" step="1" value="84"><button onclick="calc()">素因数分解する</button><div id="out" class="result" aria-live="polite"></div><script>function calc(){let n=Number(document.getElementById('v').value),a=n,f=[];if(!Number.isInteger(n)||n<2||n>100000){document.getElementById('out').textContent='2〜100000の整数を入力してください';return}for(let d=2;d*d<=n;d++){let k=0;while(n%d===0){n/=d;k++}if(k)f.push(k===1?`${d}`:`${d}^${k}`)}if(n>1)f.push(`${n}`);document.getElementById('out').textContent=`${a} = ${f.join(' × ')}`;}calc()</script></section><section><h2>確認問題</h2><p>90を素因数分解しましょう。</p><details><summary>解答・解説を表示</summary><p>90＝2×3²×5 です。</p></details></section></main><footer><div>みんなの数学データベース</div></footer></body></html>
