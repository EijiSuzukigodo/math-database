<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三角関数の方程式・不等式 | みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#19304d;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;line-height:1.6}.wrap{max-width:1050px;margin:auto;padding:18px}header{background:#17365d;color:#fff}h1{font-size:clamp(21px,4vw,30px);margin:0}header p{margin:4px 0}.panel{background:white;border:1px solid #d9e4f1;border-radius:16px;padding:16px;margin:14px 0}label{font-weight:700}select,input[type=range]{width:100%;margin-top:6px}select{padding:10px;border-radius:9px;border:1px solid #a9bcd2;font-size:17px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.value{font-size:24px;color:#1760a2;font-weight:800}.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}canvas{display:block;width:100%;height:auto;aspect-ratio:1.35;border-radius:12px;background:#fff;border:1px solid #e1e9f2}.hint{font-size:14px;color:#53667d}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.answer{font-size:19px;font-weight:700;overflow-wrap:anywhere}button{border:0;border-radius:10px;background:#1b5f9a;color:white;padding:10px 16px;font-size:16px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f3a541}footer{color:#5c6c7b;font-size:13px;padding-bottom:25px}</style></head><body><header><div class="wrap"><h1>三角関数の方程式・不等式</h1><p>単位円とグラフで、解と範囲を見つけよう</p></div></header><main class="wrap"><section class="panel controls"><div><label for="fn">関数</label><select id="fn"><option value="sin">sin θ</option><option value="cos">cos θ</option><option value="tan">tan θ</option></select></div><div><label for="op">条件</label><select id="op"><option value="=">＝</option><option value=">=">≧</option><option value="<=">≦</option><option value=">">＞</option><option value="<">＜</option></select></div><div><label for="rhs">右辺の値：<output id="rhsOut">0.50</output></label><input type="range" id="rhs" min="-2" max="2" step="0.05" value="0.5"><div class="hint">−2 〜 2（0.05刻み）</div></div></section><section class="panel"><div class="value" id="formula">sin θ = 0.50</div><div class="hint">範囲：0° ≦ θ ＜ 360°。角度は度数法です。</div><div class="answer" id="answer" aria-live="polite"></div></section><section class="plots"><div class="panel"><h2>単位円</h2><canvas id="circle" width="640" height="480" aria-label="単位円と条件を満たす角度"></canvas><p class="hint">青い円弧：不等式の解の範囲 ／ 赤い点：方程式の解</p></div><div class="panel"><h2>関数のグラフ</h2><canvas id="graph" width="640" height="480" aria-label="三角関数のグラフと条件を満たす区間"></canvas><div class="legend"><span><i class="dot" style="background:#1766aa"></i>関数</span><span><i class="dot" style="background:#e25545"></i>右辺・等号の解</span><span><i class="dot" style="background:#2aaf7c"></i>不等式の解</span></div></div></section><section class="panel"><h2>学習のポイント</h2><p id="explain">単位円の縦座標が sin θ です。グラフと水平線の交点から方程式の解を求めます。</p><button id="reset">最初の例に戻す</button></section><footer>みんなの数学データベース｜HTML単体で動作します</footer></main><script>
'use strict';const $=id=>document.getElementById(id);const PI=Math.PI,TAU=2*PI,deg=x=>x*180/PI,rad=x=>x*PI/180;const fns={sin:Math.sin,cos:Math.cos,tan:Math.tan};const symbols={'=':'＝','>=':'≧','<=':'≦','>':'＞','<':'＜'};const eps=1e-8;
function roots(fn,k){if(fn==='sin'){if(Math.abs(k)>1)return [];const a=Math.asin(k);return [a,PI-a].map(x=>(deg(x)+360)%360)}if(fn==='cos'){if(Math.abs(k)>1)return [];const a=Math.acos(k);return [deg(a),360-deg(a)]}const a=deg(Math.atan(k));return [(a+360)%360,(a+180+360)%360]}
function uniq(xs){return xs.map(x=>x>=360-1e-7?0:x).sort((a,b)=>a-b).filter((x,i,a)=>i===0||Math.abs(x-a[i-1])>1e-6)}
function passes(v,k,op){if(op==='=')return Math.abs(v-k)<1e-7;if(op==='>=')return v>=k-eps;if(op==='<=')return v<=k+eps;if(op==='>')return v>k+eps;return v<k-eps}
function intervals(fn,k,op){if(op==='=')return [];const cuts=uniq([0,360,...roots(fn,k),...(fn==='tan'?[90,270]:[])]).filter(x=>x>=0&&x<360);if(cuts[0]!==0)cuts.unshift(0);cuts.push(360);const result=[];for(let i=0;i<cuts.length-1;i++){let a=cuts[i],b=cuts[i+1];if(b-a<1e-7)continue;const mid=(a+b)/2;if(passes(fns[fn](rad(mid)),k,op))result.push([a,b]);}return result}
function formatAngle(x){return (Math.round(x*100)/100).toFixed(Math.abs(x-Math.round(x))<1e-7?0:2)+'°'}
function setup(ctx){ctx.clearRect(0,0,640,480);ctx.lineCap='round';ctx.font='17px sans-serif';}
function drawCircle(fn,k,op,rr,iv){const c=$('circle'),ctx=c.getContext('2d');setup(ctx);const cx=320,cy=240,R=170;ctx.strokeStyle='#d9e4ef';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(65,cy);ctx.lineTo(575,cy);ctx.moveTo(cx,30);ctx.lineTo(cx,450);ctx.stroke();ctx.fillStyle='#53667d';ctx.fillText('x',578,cy-8);ctx.fillText('y',cx+9,28);ctx.strokeStyle='#95aac0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();const p=a=>[cx+R*Math.cos(rad(a)),cy-R*Math.sin(rad(a))];if(op==='='){rr.forEach(a=>{let [x,y]=p(a);ctx.fillStyle='#e25545';ctx.beginPath();ctx.arc(x,y,8,0,TAU);ctx.fill();});}else{ctx.strokeStyle='#2aaf7c';ctx.lineWidth=10;for(const [a,b] of iv){ctx.beginPath();for(let x=a;x<=b+0.001;x+=1){let [xx,yy]=p(Math.min(x,b));if(x===a)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}let [ex,ey]=p(b);ctx.lineTo(ex,ey);ctx.stroke();}rr.forEach(a=>{if(fn==='tan'&&(Math.abs(a-90)<1e-6||Math.abs(a-270)<1e-6))return;let [x,y]=p(a);ctx.fillStyle='#e25545';ctx.beginPath();ctx.arc(x,y,5,0,TAU);ctx.fill();});}ctx.fillStyle='#19304d';for(const a of [0,90,180,270]){let [x,y]=p(a);ctx.fillText(a+'°',x+(a===180?-43:8),y+(a===90?-10:23))}ctx.fillStyle='#64758a';ctx.fillText('O',cx+9,cy+23)}
function drawGraph(fn,k,op,rr,iv){const ctx=$('graph').getContext('2d');setup(ctx);const left=52,right=610,top=28,bottom=430,mid=(top+bottom)/2,scale=78;const X=a=>left+(right-left)*a/360,Y=v=>mid-v*scale;ctx.strokeStyle='#e2eaf2';ctx.lineWidth=1;for(let v=-2;v<=2;v++){let y=Y(v);ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillStyle='#66778b';ctx.fillText(String(v),14,y+5)}ctx.strokeStyle='#8da1b7';ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,bottom);ctx.moveTo(left,mid);ctx.lineTo(right,mid);ctx.stroke();for(let a=0;a<=360;a+=90){let x=X(a);ctx.fillStyle='#53667d';ctx.fillText(a+'°',x-(a===0?0:18),bottom+26)}if(op!=='='){ctx.fillStyle='rgba(42,175,124,.16)';iv.forEach(([a,b])=>ctx.fillRect(X(a),top,X(b)-X(a),bottom-top));}if(k>=-2.5&&k<=2.5){ctx.strokeStyle='#e25545';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(left,Y(k));ctx.lineTo(right,Y(k));ctx.stroke();ctx.setLineDash([])}ctx.strokeStyle='#1766aa';ctx.lineWidth=3;ctx.beginPath();let active=false;for(let a=0;a<=360.001;a+=0.2){let v=fns[fn](rad(a));if(!Number.isFinite(v)||Math.abs(v)>2.65){active=false;continue}let x=X(a),y=Y(v);if(!active)ctx.moveTo(x,y);else ctx.lineTo(x,y);active=true;}ctx.stroke();ctx.fillStyle='#e25545';rr.forEach(a=>{let y=Y(k);if(y<top||y>bottom)return;ctx.beginPath();ctx.arc(X(a),y,6,0,TAU);ctx.fill();});}
function update(){const fn=$('fn').value,op=$('op').value,k=Number($('rhs').value);$('rhsOut').textContent=k.toFixed(2);$('formula').textContent=fn+' θ '+symbols[op]+' '+k.toFixed(2);const rr=uniq(roots(fn,k));const iv=intervals(fn,k,op);let txt;if(op==='='){txt=rr.length?'解：θ = '+rr.map(formatAngle).join('、'):'この範囲に解はありません';}else if(iv.length===0){txt='この範囲に解はありません';}else{txt='解の区間（境界の含み方は条件に従います）：'+iv.map(([a,b])=>formatAngle(a)+' 〜 '+formatAngle(b)).join('、');if(iv.length===1&&iv[0][0]===0&&iv[0][1]===360)txt='すべての角度が条件を満たします（0° ≦ θ ＜ 360°）';}if(fn==='tan')txt+='。tan θ は 90°、270° で定義されません。';$('answer').textContent=txt;$('explain').textContent=fn==='sin'?'単位円の縦座標が sin θ です。水平線との交点と、その上下の範囲に注目しましょう。':fn==='cos'?'単位円の横座標が cos θ です。グラフと水平線の位置関係を確認しましょう。':'tan θ は sin θ / cos θ です。90°と270°では定義されず、グラフが途切れます。';drawCircle(fn,k,op,rr,iv);drawGraph(fn,k,op,rr,iv)}['fn','op','rhs'].forEach(id=>$(id).addEventListener('input',update));$('reset').addEventListener('click',()=>{$('fn').value='sin';$('op').value='=';$('rhs').value='0.5';update()});update();
</script></body></html>
