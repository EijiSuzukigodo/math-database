<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平面ベクトルの加法・減法 | みんなの数学データベース</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#183047;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:18px 16px}header .wrap,main{max-width:960px;margin:auto}h1{font-size:clamp(22px,4vw,30px);margin:8px 0}header p{margin:4px 0}main{padding:18px 14px 45px}.panel{background:white;border:1px solid #dce6f0;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #1231  }h2{font-size:20px;color:#17365d;margin:0 0 10px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.buttons button{border:1px solid #a9bfd4;background:#fff;color:#17365d;border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer}.buttons button.active{background:#17365d;color:white}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:14px;align-items:start}@media(max-width:720px){.layout{grid-template-columns:1fr}}canvas{display:block;width:100%;height:auto;touch-action:none;background:#fff;border:1px solid #d5e0ed;border-radius:12px;cursor:crosshair}.control{margin:12px 0}.control label{display:flex;justify-content:space-between;gap:10px;font-weight:600}.control input{width:100%;accent-color:#245b91;min-height:30px}.formula{background:#f0f6fd;border-radius:10px;padding:12px;line-height:1.9;overflow-wrap:anywhere}.hint{color:#53697f;font-size:14px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}.a{background:#1565c0}.b{background:#e07917}.result{background:#087a64}.aux{background:#8c63a5}.back{color:white} .math{font-family:Georgia,'Times New Roman',serif;font-style:italic} .foot{color:#5a6b7c;font-size:14px}
</style></head><body>
<header><div class="wrap"><a class="back" href="high_school.html">← 高校数学へ戻る</a><h1>平面ベクトルの加法・減法</h1><p>矢印を動かして、ベクトルの計算を目で確かめよう</p></div></header>
<main>
<section class="panel"><h2>① 計算を選ぶ</h2><div class="buttons"><button id="add" class="active" aria-pressed="true">加法 a + b</button><button id="sub" aria-pressed="false">減法 a − b</button><button id="reset">最初に戻す</button></div><div class="legend"><span><i class="dot a"></i>ベクトル a</span><span><i class="dot b"></i>ベクトル b</span><span><i class="dot result"></i><span id="legendResult">a + b</span></span><span><i class="dot aux"></i>補助線</span></div></section>
<div class="layout"><section class="panel"><h2>② 図を動かす</h2><canvas id="plane" width="640" height="640" aria-label="ベクトルの座標平面。青とオレンジの矢印の先端をドラッグできます"></canvas><p class="hint">青・オレンジの矢印の先端を指で動かせます。パソコンではマウスでドラッグしてください。</p></section>
<section class="panel"><h2>③ 成分を変える</h2><div id="controls"></div><div class="formula" id="calculation" aria-live="polite"></div><p class="hint">スライダーでも矢印を動かせます。各成分は −5 から 5 まで、0.5 刻みです。</p></section></div>
<section class="panel"><h2>④ しくみを理解する</h2><div id="explain"></div><p class="foot">※ ベクトルは向きと大きさを持つ量です。矢印を平行移動しても、向きと大きさが同じなら同じベクトルです。</p></section>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('plane'),ctx=canvas.getContext('2d');
const controls=document.getElementById('controls'),calc=document.getElementById('calculation'),explain=document.getElementById('explain');
const state={ax:3,ay:2,bx:1,by:3,mode:'add'};
const keys=[['ax','a の x 成分'],['ay','a の y 成分'],['bx','b の x 成分'],['by','b の y 成分']];
const fmt=n=>String(Math.round(n*10)/10);const W=640,C=320,S=48;
const px=x=>C+x*S,py=y=>C-y*S;
function line(x1,y1,x2,y2,color,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(px(x1),py(y1));ctx.lineTo(px(x2),py(y2));ctx.stroke();ctx.restore()}
function arrow(x1,y1,x2,y2,color,label,thick=4){line(x1,y1,x2,y2,color,thick);let X=px(x2),Y=py(y2),angle=Math.atan2(py(y2)-py(y1),px(x2)-px(x1));ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-14*Math.cos(angle-.45),Y-14*Math.sin(angle-.45));ctx.lineTo(X-14*Math.cos(angle+.45),Y-14*Math.sin(angle+.45));ctx.closePath();ctx.fill();ctx.font='bold 20px sans-serif';ctx.fillText(label,X+9,Y-11);ctx.restore()}
function dot(x,y,color){ctx.fillStyle='#fff';ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(px(x),py(y),8,0,Math.PI*2);ctx.fill();ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,W);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,W);for(let i=-6;i<=6;i++){line(i,-6.6,i,6.6,i===0?'#63798d':'#e5edf5',i===0?2:1);line(-6.6,i,6.6,i,i===0?'#63798d':'#e5edf5',i===0?2:1)}ctx.fillStyle='#53697f';ctx.font='14px sans-serif';for(let i=-6;i<=6;i+=2){if(i){ctx.fillText(String(i),px(i)+3,py(0)+18);ctx.fillText(String(i),px(0)+5,py(i)-5)}}ctx.fillText('x',W-20,C-9);ctx.fillText('y',C+10,20);ctx.fillText('O',C+6,C+17);
const {ax,ay,bx,by,mode}=state;const sg=mode==='add'?1:-1,rx=ax+sg*bx,ry=ay+sg*by;
if(mode==='add'){line(ax,ay,rx,ry,'#8c63a5',2,[7,5]);line(bx,by,rx,ry,'#8c63a5',2,[7,5])}else{line(bx,by,ax,ay,'#8c63a5',2,[7,5]);line(ax,ay,rx,ry,'#8c63a5',2,[7,5])}
arrow(0,0,rx,ry,'#087a64',mode==='add'?'a+b':'a−b',5);arrow(0,0,ax,ay,'#1565c0','a');arrow(0,0,bx,by,'#e07917','b');dot(ax,ay,'#1565c0');dot(bx,by,'#e07917');
}
function refresh(){keys.forEach(([k])=>{document.getElementById(k).value=state[k];document.getElementById(k+'Val').textContent=fmt(state[k])});document.getElementById('add').classList.toggle('active',state.mode==='add');document.getElementById('sub').classList.toggle('active',state.mode==='sub');document.getElementById('add').setAttribute('aria-pressed',state.mode==='add');document.getElementById('sub').setAttribute('aria-pressed',state.mode==='sub');const sign=state.mode==='add'?'+':'−',sg=state.mode==='add'?1:-1;let x=state.ax+sg*state.bx,y=state.ay+sg*state.by;document.getElementById('legendResult').textContent='a '+sign+' b';calc.innerHTML=`<strong>ベクトルの成分</strong><div>a = (${fmt(state.ax)}, ${fmt(state.ay)})</div><div>b = (${fmt(state.bx)}, ${fmt(state.by)})</div><hr><strong>a ${sign} b = (${fmt(state.ax)} ${sign} (${fmt(state.bx)}), ${fmt(state.ay)} ${sign} (${fmt(state.by)}))</strong><div><strong>= (${fmt(x)}, ${fmt(y)})</strong></div>`;explain.innerHTML=state.mode==='add'?'<p><strong>加法：</strong>青のベクトル a の先端に、オレンジのベクトル b を平行移動してつなぐと、原点からその終点への矢印が a + b です。</p><p>図の紫色の点線は平行四辺形を表しています。<strong>対角線が和のベクトル</strong>になります。</p>':'<p><strong>減法：</strong>a − b は a + (−b) と同じです。b と逆向きのベクトルを a に加えると考えます。</p><p>また、<strong>b の先端から a の先端へ向かう矢印</strong>も a − b を表します。紫色の点線で確かめましょう。</p>';draw()}
keys.forEach(([k,label])=>{const d=document.createElement('div');d.className='control';d.innerHTML=`<label for="${k}"><span>${label}</span><output id="${k}Val"></output></label><input id="${k}" type="range" min="-5" max="5" step="0.5">`;controls.appendChild(d);d.querySelector('input').addEventListener('input',e=>{state[k]=Number(e.target.value);refresh()})});
document.getElementById('add').onclick=()=>{state.mode='add';refresh()};document.getElementById('sub').onclick=()=>{state.mode='sub';refresh()};document.getElementById('reset').onclick=()=>{Object.assign(state,{ax:3,ay:2,bx:1,by:3,mode:'add'});refresh()};
let dragging=null;function coord(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}}function down(e){let p=coord(e),da=Math.hypot(p.x-px(state.ax),p.y-py(state.ay)),db=Math.hypot(p.x-px(state.bx),p.y-py(state.by));if(Math.min(da,db)>34) return;dragging=da<=db?'a':'b';canvas.setPointerCapture(e.pointerId);e.preventDefault()}function move(e){if(!dragging)return;let p=coord(e),x=Math.max(-5,Math.min(5,Math.round(((p.x-C)/S)*2)/2)),y=Math.max(-5,Math.min(5,Math.round(((C-p.y)/S)*2)/2));state[dragging+'x']=x;state[dragging+'y']=y;refresh();e.preventDefault()}function up(){dragging=null}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);refresh();
})();
</script></body></html>
