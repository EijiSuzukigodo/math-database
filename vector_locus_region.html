<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ベクトルと点の存在範囲 | みんなの数学データベース</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;line-height:1.65}header{background:#17365d;color:white;padding:22px 16px}main{max-width:1020px;margin:auto;padding:20px 14px 50px}h1{font-size:clamp(22px,4vw,30px);margin:5px 0}h2{font-size:20px;color:#17365d;margin:0 0 12px}.panel{background:white;border:1px solid #dbe4ee;border-radius:16px;padding:18px;margin:14px 0}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(265px,1fr);gap:16px}@media(max-width:750px){.layout{grid-template-columns:1fr}}.btns{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #a8bed7;border-radius:9px;background:#f4f8fd;color:#17365d;font-size:15px;font-weight:700;padding:10px 13px;cursor:pointer}button.active{background:#17365d;color:white}label{font-weight:700;display:block;margin-top:15px}.sliderrow{display:flex;gap:10px;align-items:center}input[type=range]{width:100%;accent-color:#2563eb;min-height:32px}output{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}svg{width:100%;height:auto;display:block;background:#fcfdff;border:1px solid #dce5ee;border-radius:12px;touch-action:none;user-select:none}.formula{font-size:clamp(16px,3vw,20px);font-weight:bold;color:#17365d}.explain{background:#edf5ff;padding:12px;border-radius:10px}.hint{color:#52667f;font-size:14px}.dot{cursor:grab}.dot:active{cursor:grabbing}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin:8px 0}.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}.value{font-variant-numeric:tabular-nums}a{color:#245b91}</style></head><body><header><div style="max-width:1020px;margin:auto"><a href="high_school.html" style="color:#dbeafe">← 高校数学に戻る</a><h1>ベクトルによる点の存在範囲</h1><div>数学C｜係数を動かして、点Pの動く範囲を見つけよう</div></div></header><main>
<section class="panel"><h2>① 条件を選ぶ</h2><div class="btns" id="modes"><button data-mode="triangle" class="active">三角形の内部・周上</button><button data-mode="line">線分AB</button><button data-mode="parallelogram">平行四辺形</button></div><p id="condition" class="formula"></p><div class="hint">すべての図で O=(0,0)、ベクトル OP = s OA + t OB とします。</div></section>
<div class="layout"><section class="panel"><h2>② 点Pを動かす</h2><svg id="plot" viewBox="0 0 560 460" role="img" aria-label="ベクトルOA、OBと点Pの存在範囲を表す座標図"><defs><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ea580c"/></marker><marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#16a34a"/></marker></defs><g id="grid"></g><polygon id="region" fill="#60a5fa" fill-opacity=".23" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round"/><line id="oa" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowA)"/><line id="ob" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowB)"/><line id="op" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrowP)"/><g id="points"></g></svg><div class="legend"><span><span class="sw" style="background:#2563eb"></span>A（青）</span><span><span class="sw" style="background:#ea580c"></span>B（オレンジ）</span><span><span class="sw" style="background:#16a34a"></span>P（緑）</span></div><p class="hint">青・オレンジの点A・Bを指やマウスでドラッグできます。緑の点Pもドラッグできます。</p></section>
<section class="panel"><h2>③ 係数を変える</h2><label for="s">係数 s</label><div class="sliderrow"><input id="s" type="range" min="0" max="1" step="0.01" value="0.30"><output id="sv">0.30</output></div><label for="t">係数 t</label><div class="sliderrow"><input id="t" type="range" min="0" max="1" step="0.01" value="0.35"><output id="tv">0.35</output></div><p class="hint" id="sliderhint"></p><div class="btns"><button id="mid">ABの中点</button><button id="reset">初期状態に戻す</button></div><hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0"><div class="formula">OP = s OA + t OB</div><p id="coords" class="value"></p><p id="calc" class="value"></p><p id="status" class="explain" aria-live="polite"></p></section></div>
<section class="panel"><h2>④ なぜこの範囲になるの？</h2><div id="lesson"></div><p class="hint">注意：AとBが原点Oと一直線上に並ぶと、三角形や平行四辺形の面積は0になります。点A・Bを動かして確かめてください。</p></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),S=$('s'),T=$('t'),svg=$('plot');let mode='triangle',A={x:5,y:0},B={x:2,y:5},s=.3,t=.35,drag=null;const scale=38,ox=185,oy=295;const X=x=>ox+x*scale,Y=y=>oy-y*scale,pt=p=>`${X(p.x)},${Y(p.y)}`;const fmt=n=>Math.abs(n)<.005?'0':n.toFixed(2);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function bounds(){return mode==='triangle'?{smax:1,tmax:1-s}:mode==='line'?{smax:1,tmax:1-s}:{smax:1,tmax:1}}function normalize(){s=clamp(s,0,1);t=mode==='line'?1-s:clamp(t,0,mode==='triangle'?1-s:1)}function position(){return{x:s*A.x+t*B.x,y:s*A.y+t*B.y}}function setLine(id,a,b){let e=$(id);e.setAttribute('x1',X(a.x));e.setAttribute('y1',Y(a.y));e.setAttribute('x2',X(b.x));e.setAttribute('y2',Y(b.y))}function dot(name,p,color,draggable=true){return `<circle class="dot" data-drag="${name}" cx="${X(p.x)}" cy="${Y(p.y)}" r="9" fill="${color}" stroke="white" stroke-width="2.5"/><text x="${X(p.x)+12}" y="${Y(p.y)-11}" fill="${color}" font-size="17" font-weight="bold">${name}</text>`}function drawGrid(){let h='';for(let k=-6;k<=9;k++){let x=X(k);if(x>=0&&x<=560)h+=`<line x1="${x}" y1="0" x2="${x}" y2="460" stroke="${k===0?'#94a3b8':'#e7edf5'}" stroke-width="${k===0?1.7:1}"/>`}for(let k=-4;k<=7;k++){let y=Y(k);if(y>=0&&y<=460)h+=`<line x1="0" y1="${y}" x2="560" y2="${y}" stroke="${k===0?'#94a3b8':'#e7edf5'}" stroke-width="${k===0?1.7:1}"/>`}h+=`<text x="${ox+7}" y="${oy+19}" font-size="14" fill="#475569">O</text>`;$('grid').innerHTML=h}function render(){normalize();let P=position(),O={x:0,y:0};let vertices=mode==='triangle'?[O,A,B]:mode==='line'?[A,B]:[O,A,{x:A.x+B.x,y:A.y+B.y},B];$('region').setAttribute('points',vertices.map(pt).join(' '));$('region').setAttribute('fill-opacity',mode==='line'?'0':'.23');setLine('oa',O,A);setLine('ob',O,B);setLine('op',O,P);$('points').innerHTML=dot('A',A,'#2563eb')+dot('B',B,'#ea580c')+dot('P',P,'#16a34a');S.value=s;S.max=1;T.value=t;T.max=mode==='triangle'?Math.max(0,1-s):1;T.disabled=mode==='line';$('sv').textContent=fmt(s);$('tv').textContent=fmt(t);$('sliderhint').textContent=mode==='triangle'?'t の上限は 1−s です。常に s+t≦1 を満たします。':mode==='line'?'t=1−s に固定しています。':'s、t はそれぞれ0から1まで変えられます。';$('coords').textContent=`A=(${fmt(A.x)}, ${fmt(A.y)}), B=(${fmt(B.x)}, ${fmt(B.y)})`; $('calc').textContent=`P=(${fmt(P.x)}, ${fmt(P.y)})　s+t=${fmt(s+t)}`;$('status').textContent=mode==='triangle'?'Pは三角形OABの内部または周上にあります。':mode==='line'?'Pは線分AB上にあります。':'PはO、A、A+B、Bを頂点とする平行四辺形の内部または周上にあります。';$('condition').textContent=mode==='triangle'?'s ≧ 0,  t ≧ 0,  s + t ≦ 1':mode==='line'?'s ≧ 0,  t ≧ 0,  s + t = 1':'0 ≦ s ≦ 1,  0 ≦ t ≦ 1';$('lesson').innerHTML=mode==='triangle'?'<p>まず <b>sOA</b> だけ進み、続いて <b>tOB</b> だけ進むとPに到着します。係数がどちらも0以上で、合計が1以下なら、Pは三角形OABの内部または周上にとどまります。</p><p><b>s+t=1</b> のとき辺AB上、<b>s=0</b> のとき辺OB上、<b>t=0</b> のとき辺OA上です。</p>':mode==='line'?'<p><b>t=1−s</b> とおくと、OP=sOA+(1−s)OB です。s=0でP=B、s=1でP=A。0≦s≦1の間は線分AB上を動きます。</p>':'<p>sOA と tOB をそれぞれ0倍から1倍まで動かすと、Pは2本のベクトルが張る平行四辺形全体を動きます。</p><p>s=0や1、t=0や1のときは境界上です。</p>';document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))})}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;s=.3;t=mode==='line'?.7:.35;render()}));S.addEventListener('input',()=>{s=+S.value;if(mode==='line')t=1-s;render()});T.addEventListener('input',()=>{t=+T.value;render()});$('mid').addEventListener('click',()=>{mode='line';s=.5;t=.5;render()});$('reset').addEventListener('click',()=>{mode='triangle';A={x:5,y:0};B={x:2,y:5};s=.3;t=.35;render()});function coord(ev){let rect=svg.getBoundingClientRect();let xx=(ev.clientX-rect.left)*560/rect.width,yy=(ev.clientY-rect.top)*460/rect.height;return{x:(xx-ox)/scale,y:(oy-yy)/scale}}svg.addEventListener('pointerdown',e=>{let node=e.target.closest('[data-drag]');if(!node)return;drag=node.dataset.drag;svg.setPointerCapture(e.pointerId);e.preventDefault()});svg.addEventListener('pointermove',e=>{if(!drag)return;let p=coord(e);if(drag==='A'||drag==='B'){let q={x:Math.round(clamp(p.x,-4.5,8)*10)/10,y:Math.round(clamp(p.y,-3.5,6.5)*10)/10};if(drag==='A')A=q;else B=q}else{let det=A.x*B.y-A.y*B.x;if(Math.abs(det)>1e-6){let ss=(p.x*B.y-p.y*B.x)/det,tt=(A.x*p.y-A.y*p.x)/det;if(mode==='line'){s=clamp((ss+1-tt)/2,0,1);t=1-s}else if(mode==='triangle'){s=clamp(ss,0,1);t=clamp(tt,0,1-s)}else{s=clamp(ss,0,1);t=clamp(tt,0,1)}}}render();e.preventDefault()});function end(){drag=null}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);drawGrid();render()})();
</script></body></html>
