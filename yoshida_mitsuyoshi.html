<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吉田光由｜みんなの数学データベース</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#253347;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.8}header{background:#17365d;color:#fff;padding:30px 18px}header div,main,footer div{max-width:920px;margin:auto}h1{margin:0;font-size:clamp(24px,4vw,36px)}header p{margin:5px 0}main{padding:26px 18px 55px}h2{color:#17365d;margin-top:0}section{background:#fff;border:1px solid #d8e3ef;border-radius:16px;padding:22px;margin:18px 0}a{color:#176cae}a:focus-visible,input:focus-visible{outline:3px solid #ed9d24;outline-offset:3px}input{font-size:17px;width:100%;max-width:280px;padding:10px;border:1px solid #abc3da;border-radius:8px}button{font-size:16px;background:#176cae;color:white;border:0;padding:11px 18px;border-radius:9px;cursor:pointer}.formula{font-size:24px;font-weight:bold;color:#17365d;background:#edf4fc;border-radius:12px;padding:18px;text-align:center}.result{background:#e9f7f1;border-radius:10px;padding:14px;margin-top:12px;min-height:48px}footer{background:#17365d;color:white;padding:18px}.back{display:inline-block;margin-bottom:8px}small{color:#667085}svg{max-width:100%;height:auto}</style></head><body><header><div><h1>吉田光由</h1><p>日本の数学者と数学を学ぶ</p></div></header><main><a class="back" href="mathematicians_japan.html">← 日本の数学者一覧へ戻る</a><section><h2>人物紹介</h2><p>江戸時代の数学書『塵劫記』の著者。日常生活に役立つ計算を広めました。</p><small>※歴史上の研究と、以下の学習用の題材は必ずしも同一ではありません。</small></section><section><h2>数学のテーマ：割合と日常の計算</h2><div class="formula">代金＝単価×個数</div><p>単価120円の品を5個買うと600円です。</p></section><section><h2>動く教材：買い物の計算</h2><p>単価と個数を変えて代金を求めましょう。</p><label>単価（円）<input id="a" type="number" min="0" value="120" oninput="calc()"></label><label>個数<input id="b" type="number" min="0" step="1" value="5" oninput="calc()"></label><div id="out" class="result" aria-live="polite"></div><script>function calc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('out').textContent=a>=0&&b>=0&&Number.isInteger(b)?`代金：${(a*b).toLocaleString('ja-JP')} 円`:'0以上の単価と整数の個数を入力してください';}calc()</script></section><section><h2>確認問題</h2><p>単価250円の品を8個買うと代金はいくらですか。</p><details><summary>解答・解説を表示</summary><p>2000円。250×8＝2000です。</p></details></section></main><footer><div>みんなの数学データベース</div></footer></body></html>
